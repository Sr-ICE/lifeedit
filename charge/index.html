<style>
  /* 4-5room.com/charge/ の型（build.py が ITEMS・PRICES・DESC・CWA を埋める）。2026-10-15 下絵に本人 OK「わかりやすくていいのではないかな」。
     本人と決めたこと：種類のタブ／紹介した・持っていないを同じ一覧に混ぜる／
     並べ替え・条件で絞る・2〜3点の比較表／見た目は「電池の残量メーター」で、メーターの横に必ず数字。
     色と書体は公開中の /earphones/（白地・Inter＋Noto Sans JP）にそろえた */
  :root {
    --bg: #ffffff; --soft: #f5f5f7; --ink: #1d1d1f; --sub: #6e6e73; --faint: #a1a1a6; --line: #e5e5ea;
    --charge: #12805c; --charge-bg: #e6f4ee; --heavy: #8e8e93; --shell: #c7c7cc; --dark: #1d1d1f;
    --en: "Inter", "Helvetica Neue", Arial, sans-serif;
    --jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--jp); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  .num { font-family: var(--en); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  .top { display: flex; align-items: center; height: 56px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .top b { font-family: var(--en); font-weight: 700; }
  .top span { color: var(--sub); margin-left: 10px; }

  /* 見出し */
  .head { padding: 34px 0 6px; }
  .eyebrow { margin: 0; font: 600 14px var(--en); color: var(--charge); letter-spacing: .02em; }
  h1 { margin: 2px 0 0; font-size: clamp(28px, 6vw, 38px); line-height: 1.25; }
  .lead { margin: 10px 0 0; font-size: 15px; color: #3a3a3c; max-width: 40em; }
  .when { margin: 10px 0 0; font-size: 13px; color: var(--sub); }
  .disc { margin: 2px 0 0; font-size: 12px; color: var(--sub); }

  /* 種類のタブ（上に貼り付く） */
  .tabs { position: sticky; top: 0; z-index: 10; margin: 22px -20px 0; padding: 0 20px; background: rgba(255, 255, 255, .94);
          -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .tabs-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs-in::-webkit-scrollbar { display: none; }
  .tab { all: unset; cursor: pointer; flex: none; padding: 14px 12px 12px; font-size: 15px; font-weight: 500; color: var(--sub); border-bottom: 2.5px solid transparent; white-space: nowrap; }
  .tab small { font: 600 12px var(--en); margin-left: 5px; color: var(--faint); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
  .tab[aria-selected="true"] small { color: var(--sub); }
  .tab:focus-visible { outline: 2px solid var(--charge); outline-offset: -2px; }

  /* 切り替え・並べ替え・条件 */
  .tools { display: grid; gap: 12px; padding: 18px 0 4px; }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .line > .lb { font-size: 13px; color: var(--sub); margin-right: 4px; min-width: 4.5em; }
  @media (max-width: 559px) { .line > .lb { flex-basis: 100%; margin: 0; } .seg { width: 100%; } .seg button { flex: 1; text-align: center; padding: 6px 4px; } }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--soft); }
  .seg button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--sub); white-space: nowrap; }
  .seg button small { font: 600 12px var(--en); margin-left: 4px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .pill { all: unset; cursor: pointer; padding: 6px 13px; border-radius: 999px; background: var(--soft); font-size: 13.5px; color: #3a3a3c; white-space: nowrap; }
  .pill small { font: 600 11.5px var(--en); margin-left: 4px; color: var(--faint); }
  .pill[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
  .pill[aria-pressed="true"] small { color: rgba(255, 255, 255, .7); }
  .seg button:focus-visible, .pill:focus-visible { outline: 2px solid var(--charge); outline-offset: 2px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 4px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-size: 12.5px; color: var(--sub); }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend > span:empty { display: none; }
  .legend .bat { width: 44px; height: 14px; }
  .count { margin: 14px 0 0; font-size: 13px; color: var(--sub); }

  /* 1行 */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 84px minmax(0, 1fr); grid-template-areas: "ph info" "mt mt" "buy buy"; gap: 12px 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .ph { grid-area: ph; position: relative; aspect-ratio: 1 / 1; border-radius: 16px; background: var(--soft); overflow: hidden; align-self: start; }
  .ph img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; }
  .ph .none { position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; text-align: center; color: var(--faint); font: 600 11px/1.3 var(--en); }
  .info { grid-area: info; min-width: 0; }
  .br { margin: 0; font: 600 12.5px var(--en); color: var(--sub); }
  .nm { margin: 1px 0 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 0; padding: 0; list-style: none; }
  .tags li { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: #3a3a3c; }
  .tags li.new { background: none; padding: 0 2px 0 0; color: var(--sub); }
  .tags li.new::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--faint); vertical-align: 1px; }
  .basis { margin: 6px 0 0; font-size: 12px; color: var(--sub); }
  .vid { margin: 8px 0 0; font-size: 13px; }
  .vid a { display: flex; gap: 6px; align-items: baseline; min-width: 0; color: #3a3a3c; }
  .vid a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
  .vid .k { flex: none; font-size: 12px; color: var(--sub); }
  .vid .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vid .d { flex: none; font: 500 12px var(--en); color: var(--sub); }
  .vid details { margin-top: 2px; }
  .vid summary { cursor: pointer; font-size: 12px; color: var(--sub); list-style: none; }
  .vid summary::-webkit-details-marker { display: none; }
  .vid summary::before { content: "＋ "; }
  .vid details[open] summary::before { content: "－ "; }
  .vid details a { margin-top: 3px; }

  /* 電池のメーター */
  .mt { grid-area: mt; display: grid; gap: 7px; align-content: start; }
  .m { display: grid; grid-template-columns: 4.2em 70px minmax(0, 1fr); align-items: center; gap: 8px; }
  .m .k { font-size: 13px; color: var(--sub); }
  .bat { position: relative; display: inline-grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 62px; height: 18px; padding: 2px; border: 1.5px solid var(--shell); border-radius: 5px; }
  .bat::after { content: ""; position: absolute; right: -5px; top: 50%; width: 3px; height: 7px; margin-top: -3.5px; border-radius: 0 2px 2px 0; background: var(--shell); }
  .bat i { border-radius: 2px; }
  .bat i.on { background: var(--charge); }
  .bat.w i.on { background: var(--heavy); }
  .bat.none { border-style: dashed; }
  .bat.none::after { opacity: .6; }
  .m .v b { font: 700 16px var(--en); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .m .v small { font: 500 12px var(--en); color: var(--sub); margin-left: 2px; }
  .m .v.na { font-size: 13px; color: var(--faint); }

  /* 値段と Amazon */
  .buy { grid-area: buy; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .pr { min-width: 0; }
  .pr b { font: 700 20px var(--en); letter-spacing: -.02em; }
  .pr s { font: 500 13px var(--en); color: var(--faint); margin-left: 6px; }
  .pr em { font: 700 12.5px var(--en); font-style: normal; color: #c2410c; margin-left: 6px; }
  .pr small { display: block; font-size: 11.5px; color: var(--sub); }
  .pr .no { font-size: 13.5px; color: var(--sub); }
  .acts { display: flex; gap: 8px; }
  .amz { display: grid; place-items: center; height: 42px; padding: 0 16px; border-radius: 11px; background: var(--dark); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .amz:hover { background: #000; }
  .cmp { all: unset; cursor: pointer; display: grid; place-items: center; height: 42px; padding: 0 14px; border-radius: 11px; background: var(--soft); font-size: 13.5px; white-space: nowrap; }
  .cmp[aria-pressed="true"] { background: var(--charge-bg); color: var(--charge); font-weight: 700; }
  .cmp[disabled] { opacity: .4; cursor: default; }
  .amz:focus-visible, .cmp:focus-visible { outline: 2px solid var(--charge); outline-offset: 2px; }

  @media (min-width: 820px) {
    .row { grid-template-columns: 112px minmax(0, 1fr) 280px 190px; grid-template-areas: "ph info mt buy"; gap: 0 24px; align-items: start; }
    .buy { flex-direction: column; align-items: stretch; justify-content: flex-start; }
    .acts { flex-direction: column-reverse; }
    .cmp { height: 34px; background: none; color: var(--sub); font-size: 13px; }
    .cmp[aria-pressed="true"] { background: var(--charge-bg); }
    .mt { padding-top: 4px; }
  }

  /* 販売終了 */
  .ended { margin-top: 44px; }
  .ended h2 { margin: 0; font-size: 17px; }
  .ended > p { margin: 4px 0 0; font-size: 12.5px; color: var(--sub); }
  .ended .row { opacity: .9; }
  .ended .nm { font-weight: 500; }
  .empty { padding: 30px 0; color: var(--sub); font-size: 14px; }

  .notes { margin: 52px 0 0; padding: 0 0 120px; color: var(--sub); font-size: 12px; line-height: 1.85; }
  .notes p { margin: 0 0 8px; }

  /* 比べるの帯と比較表 */

  .tray-in { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .tray .thumbs { display: flex; gap: 6px; flex: none; }
  .tray .thumbs span { width: 40px; height: 40px; border-radius: 10px; background: var(--soft); overflow: hidden; position: relative; }
  .tray .thumbs img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; mix-blend-mode: multiply; }
  .tray .msg { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); }

  .tray .go[disabled] { opacity: .35; cursor: default; }

  .sheet[hidden] { display: none; }

               -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .sheet .bk b { font-size: 15px; }
  .sheet .bk button { all: unset; cursor: pointer; font-size: 15px; font-weight: 500; color: var(--charge); }
  .sheet .in { max-width: 1000px; margin: 0 auto; padding: 16px 20px 72px; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 420px; table-layout: fixed; }
  th, td { padding: 12px 10px; vertical-align: top; text-align: left; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  thead th { border-bottom: none; }
  th.k { width: 84px; font-size: 12.5px; font-weight: 500; color: var(--sub); padding-left: 0; }
  td .ph { width: 100%; max-width: 140px; }
  tr.lab { display: none; }
  tr.lab th { padding: 14px 0 0; border-bottom: none; font-size: 12px; font-weight: 500; color: var(--sub); }
  tr.lab + tr td { padding-top: 4px; }
  @media (max-width: 559px) { table { min-width: 0; } th.k { display: none; } tr.lab { display: table-row; } th, td { padding: 10px 6px; } td:first-of-type, thead th:nth-child(2) { padding-left: 0; } td .nm { font-size: 13px; } }
  td .nm { font-size: 14px; }
  td .bat { width: 52px; height: 16px; margin-bottom: 4px; display: grid; }
  td b.n { font: 700 17px var(--en); font-variant-numeric: tabular-nums; }
  td small.u { font: 500 11.5px var(--en); color: var(--sub); margin-left: 2px; }
  td.win b.n { color: var(--charge); }
  td .best { display: block; font-size: 11.5px; color: var(--charge); font-weight: 700; margin-top: 1px; }
  td .na { color: var(--faint); }
  td .amz { height: 38px; font-size: 13px; padding: 0 10px; margin-top: 8px; }
  .tbl-note { margin: 12px 0 0; font-size: 12px; color: var(--sub); }
</style>
</head>

  document.getElementById("tools").innerHTML = `
    <div class="line"><span class="lb">表示</span><span class="seg">${[["all", "全部"], ["A", "紹介した"], ["B", "持っていない"]].map(([g, w]) =>
      `<button type="button" data-grp="${g}" aria-pressed="${grp === g}">${w}<small>${n[g]}</small></button>`).join("")}</span></div>
    <div class="line"><span class="lb">並べ替え</span>${sortable.map(([k, w]) => `<button type="button" class="pill" data-sort="${k}" aria-pressed="${sortBy[cat] === k}">${w}</button>`).join("")}</div>
    ${cs.length ? `<div class="line"><span class="lb">条件</span>${cs.map(([k, w, c]) => `<button type="button" class="pill" data-cond="${k}" aria-pressed="${conds[cat].has(k)}">${w}<small>${c}</small></button>`).join("")}</div>` : ""}
    <p class="legend">${METERS[cat].map(([k, name, step, unit, heavy]) => `<span>${batHTML(step, step, heavy)}${name} 1目盛り＝${k === "cable_len_m" ? "50cm" : yen(step) + unit}</span>`).join("")}<span>${METERS[cat].some((m) => m[4]) ? "重さは灰色（目盛りが多いほど重い）" : ""}</span></p>`;
  const list = sortList(base.filter((it) => passGrp(it) && passConds(it)));
  document.getElementById("count").textContent = `${list.length}点${conds[cat].size ? "（条件は公式に書かれているものだけで絞っています）" : ""}`;
  document.getElementById("rows").innerHTML = list.map(row).join("") || `<li class="empty">当てはまるものはありません</li>`;
  const ended = sortList(all.filter((it) => gone(it) && passGrp(it) && passConds(it)));
  document.getElementById("ended").innerHTML = ended.length ? `<h2>販売終了</h2><p>動画で紹介したもののうち、Amazon の商品ページがなくなったもの（${ended.length}点）</p><ul class="rows">${ended.map(endedRow).join("")}</ul>` : "";
  tray();
}

function tray() {
  const ids = picks[cat], $t = document.getElementById("tray");
  if (!ids.length) { $t.hidden = true; return; }
  $t.hidden = false;
  const its = ids.map((id) => ITEMS.find((it) => it.id === id));
  $t.innerHTML = `<div class="tray-in"><span class="thumbs">${its.map((it) => `<span>${P(it) && P(it).img ? `<img src="${esc(P(it).img)}" alt="">` : ""}</span>`).join("")}</span>
    <span class="msg">${ids.length < 2 ? "もう1点選ぶと比べられます" : `${ids.length}点を選んでいます（3点まで）`}</span>
    <button type="button" class="clr" data-clear>やめる</button><button type="button" class="go" data-go${ids.length < 2 ? " disabled" : ""}>比べる</button></div>`;
}

function priceWordOf(it) { const q = P(it); return !LIVE_OK ? "Amazonで" : q && q.out ? "在庫切れ・値段なし" : "値段を取れませんでした"; }
// 比較表：数字の行は、いちばん良いもの（大きい・軽い・安い）を緑に
function sheet() {
  const its = picks[cat].map((id) => ITEMS.find((it) => it.id === id));
  const cell = (inner, cls) => `<td${cls ? ` class="${cls}"` : ""}>${inner}</td>`;
  // PC は左に項目名、スマホは項目名を値の上の行に出す
  const tr = (label, cells) => `<tr class="lab"><th colspan="${its.length}">${label}</th></tr><tr><th class="k">${label}</th>${cells.join("")}</tr>`;
  const numRow = (label, k, step, unit, heavy, lower) => {
    const vs = its.map((it) => k === "price" ? (live(it) ? live(it).amount : null) : it.s[k]);
    const got = vs.filter((v) => v != null);
    const best = got.length >= 2 && new Set(got).size > 1 ? (lower ? Math.min(...got) : Math.max(...got)) : null;
    const word = k === "price" ? "いちばん安い" : lower ? "いちばん軽い" : k === "cable_len_m" ? "いちばん長い" : "いちばん大きい";
    return tr(label, vs.map((v, j) => {
      if (v == null) return cell(`${step ? batHTML(null) : ""}<span class="na">${k === "price" ? priceWordOf(its[j]) : "未公表"}</span>`);
      const [t, u] = k === "price" ? ["¥" + yen(v), ""] : numTxt(k, v);
      return cell(`${step ? batHTML(v, step, heavy) : ""}<b class="n">${t}</b><small class="u">${u || unit}</small>${v === best ? `<span class="best">${word}</span>` : ""}`, v === best ? "win" : "");
    }));
  };
  const yesRow = (label, f) => tr(label, its.map((it) => cell(f(it.s) === true ? "あり" : `<span class="na">記載なし</span>`)));
  const txtRow = (label, f) => tr(label, its.map((it) => cell(f(it) ? esc(f(it)) : `<span class="na">記載なし</span>`)));
  const rows = [
    `<thead><tr><th class="k"></th>${its.map((it) => `<th>${photo(it)}<p class="br" style="margin-top:8px">${esc(it.brand)}</p><p class="nm">${esc(it.name)}</p></th>`).join("")}</tr></thead><tbody>`,
    numRow("値段", "price", null, "", 0, 1),
    ...METERS[cat].map(([k, name, step, unit, heavy]) => numRow(name, k, step, unit, heavy, !!heavy)),
    cat !== "cable" ? txtRow("口", (it) => it.s.ports) : "",
    cat === "power_bank" ? txtRow("ワイヤレス", (it) => it.s.wireless_w ? `${it.s.wireless_w}W${it.s.wireless_std ? "（" + it.s.wireless_std + "）" : ""}` : "") : "",
    cat === "wireless" ? txtRow("規格", (it) => it.s.wireless_std) : "",
    txtRow("サイズ", (it) => it.s.size_mm ? it.s.size_mm + "mm" : ""),
    ...CONDS[cat].filter(([k]) => ["gan", "fold", "cable", "disp"].includes(k)).map(([, w, f]) => yesRow(w, f)),
    txtRow("発売", (it) => it.release ? ym(it.release) : ""),
    tr("紹介", its.map((it) => cell(it.group === "A" && it.v && it.v.length ? `<a href="https://www.youtube.com/watch?v=${esc(it.v[0].id)}" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:3px">${esc(it.v[0].title)}</a>` : `<span class="na">持っていない・新しいもの</span>`))),
    `<tr><th class="k"></th>${its.map((it) => cell(`<a class="amz" href="${esc(amazonUrl(it))}" target="_blank" rel="sponsored noopener">Amazonで見る</a>`)).join("")}</tr></tbody>`,
  ];
  const $s = document.getElementById("sheet");
  $s.innerHTML = `<div class="bk"><b>比べる（${its.length}点）</b><button type="button" data-close>閉じる</button></div>
    <div class="in"><div class="tbl"><table>${rows.join("")}</table></div>
    <p class="tbl-note">「記載なし」「未公表」は、公式の仕様に書かれていないものです。値段は Amazon ${atTxt} 時点</p></div>`;
  $s.hidden = false; document.body.style.overflow = "hidden"; $s.scrollTop = 0;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.cat) { cat = b.dataset.cat; render(); window.scrollTo({ top: Math.min(window.scrollY, document.querySelector(".tabs").offsetTop) }); return; }
  if (b.dataset.grp) { grp = b.dataset.grp; render(); return; }
  if (b.dataset.sort) { sortBy[cat] = b.dataset.sort; render(); return; }
  if (b.dataset.cond) { const s = conds[cat]; s.has(b.dataset.cond) ? s.delete(b.dataset.cond) : s.add(b.dataset.cond); render(); return; }
  if (b.dataset.cmp) { const l = picks[cat], i = l.indexOf(b.dataset.cmp); i >= 0 ? l.splice(i, 1) : l.length < 3 && l.push(b.dataset.cmp); render(); return; }
  if ("clear" in b.dataset) { picks[cat] = []; render(); return; }
  if ("go" in b.dataset) { sheet(); return; }
  if ("close" in b.dataset) { document.getElementById("sheet").hidden = true; document.body.style.overflow = ""; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("sheet").hidden) document.querySelector("[data-close]").click(); });

document.getElementById("when").textContent = LIVE_OK ? `${atTxt} 時点の Amazon の値段` : "Amazon の値段は、商品ページで確かめてください";
document.getElementById("notes").innerHTML = `
  ${LIVE_OK ? `<p>価格および発送可能時期は表示された日付・時刻（${atTxt}）の時点のものであり、変更される場合があります。本商品の購入においては、購入の時点でAmazon.co.jpに表示されている価格および発送可能時期の情報が適用されます。</p>` : ""}
  <p>スペックは、各商品の Amazon の商品ページ（メーカーの仕様表）を主に 2026年10月14〜15日に調べたものです。公式に書かれていない項目は「未公表」としています。販売終了のものは、発売時の発表・販売店の表記などから載せています。スペックを確かめられなかったものは載せていません。</p>
  <p>「持っていない・新しいもの」は、私がまだ使っていないもので、主に Amazon の新着・売れ筋ランキング（2026年10月14日）から選びました。割引率は Amazon の商品ページに表示された参考価格・過去価格との比較です。</p>
  <p>Amazonのアソシエイトとして、4.5roomは適格販売により収入を得ています。</p>`;
render();
</script>
