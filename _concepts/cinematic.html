<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.5room — Cinematic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:#0b0b0d; color:#fff; -webkit-font-smoothing:antialiased; font-feature-settings:"palt"; }
  .hero { position:relative; min-height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  .hero-bg { position:absolute; inset:0; z-index:0; }
  .hero-bg img { width:100%; height:100%; object-fit:cover; }
  .hero-bg::after { content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, rgba(8,8,10,.97) 26%, rgba(8,8,10,.78) 52%, rgba(8,8,10,.35) 100%),
               linear-gradient(0deg, rgba(8,8,10,.9) 0%, transparent 40%); }
  header { position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between;
    padding:30px 56px; }
  .logo { font-weight:800; font-size:20px; letter-spacing:.04em; }
  .logo b { color:#0ABAB5; }
  nav { display:flex; gap:34px; font-size:13.5px; color:rgba(255,255,255,.7); letter-spacing:.04em; }
  nav a { color:inherit; text-decoration:none; }
  .sub { border:1px solid rgba(255,255,255,.25); padding:9px 20px; border-radius:999px; font-size:13px; font-weight:700; color:#fff; }
  .hero-body { position:relative; z-index:3; flex:1; display:flex; align-items:center; padding:0 56px; }
  .inner { max-width:680px; }
  .eyebrow { font-size:12px; letter-spacing:.42em; color:#0ABAB5; font-weight:700; margin-bottom:26px; }
  h1 { font-size:clamp(44px,6.5vw,82px); line-height:1.08; font-weight:800; letter-spacing:-.02em; margin-bottom:28px; }
  .lead { font-size:17px; line-height:1.9; color:rgba(255,255,255,.72); max-width:480px; margin-bottom:40px; }
  .cta { display:flex; gap:14px; align-items:center; }
  .btn { padding:16px 34px; border-radius:8px; font-weight:700; font-size:15px; text-decoration:none; }
  .btn-fill { background:#0ABAB5; color:#04201f; }
  .btn-line { border:1px solid rgba(255,255,255,.3); color:#fff; }
  .now { position:relative; z-index:3; padding:0 56px 40px; display:flex; align-items:center; gap:16px; color:rgba(255,255,255,.6); font-size:13px; }
  .now .dot { width:7px; height:7px; border-radius:50%; background:#0ABAB5; box-shadow:0 0 0 4px rgba(10,186,181,.2); }
  .now b { color:#fff; font-weight:600; }
</style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg">
      <img src="https://img.youtube.com/vi/lLwJPCPSBvs/maxresdefault.jpg"
           onerror="this.src='https://img.youtube.com/vi/lLwJPCPSBvs/hqdefault.jpg'" alt="">
    </div>
    <header>
      <div class="logo">4.5<b>room</b></div>
      <nav><a href="#">About</a><a href="#">Videos</a><a href="#">Contact</a></nav>
      <a class="sub" href="#">登録する</a>
    </header>
    <div class="hero-body">
      <div class="inner">
        <div class="eyebrow">EVERYDAY CARRY</div>
        <h1>持ち物で、<br>毎日は変わる。</h1>
        <p class="lead">iPad mini、ミニマルなバッグ、こだわりの文房具。手元から"いい道具"を静かに語る、顔出しなしのチャンネル。</p>
        <div class="cta">
          <a class="btn btn-fill" href="#">チャンネル登録</a>
          <a class="btn btn-line" href="#">最新の動画 ▶</a>
        </div>
      </div>
    </div>
    <div class="now"><span class="dot"></span>NOW PLAYING &nbsp;—&nbsp; <b>見せて運ぶiPad mini。無印の新モデルで作るEDC</b></div>
  </section>
</body>
</html>
