<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>4.5room — Product</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --ink:#1d1d1f; --sub:#6e6e73; --bg:#fff; --bg2:#f5f5f7; --accent:#0ABAB5; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; font-feature-settings:"palt"; }
  header { display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:56px; border-bottom:1px solid rgba(0,0,0,.08); position:sticky; top:0; background:rgba(255,255,255,.8); backdrop-filter:blur(14px); }
  .logo { font-weight:700; font-size:18px; letter-spacing:-.01em; }
  .logo b { color:var(--accent); }
  nav { display:flex; gap:32px; font-size:13px; color:var(--sub); }
  nav a { color:inherit; text-decoration:none; }
  .hero { text-align:center; padding:72px 24px 0; max-width:980px; margin:0 auto; }
  .eyebrow { font-size:15px; font-weight:600; color:var(--accent); letter-spacing:.01em; margin-bottom:10px; }
  h1 { font-size:clamp(40px,6vw,68px); font-weight:700; letter-spacing:-.025em; line-height:1.08; margin-bottom:18px; }
  .lead { font-size:19px; color:var(--sub); line-height:1.6; max-width:560px; margin:0 auto 26px; }
  .links { display:flex; gap:26px; justify-content:center; font-size:16px; }
  .links a { color:var(--accent); text-decoration:none; font-weight:500; }
  .links a::after { content:" ›"; }
  .stage { margin-top:54px; position:relative; }
  .stage img { width:100%; max-width:1000px; border-radius:18px; box-shadow:0 50px 90px -40px rgba(0,0,0,.5); }
  .stage::before { content:""; position:absolute; left:50%; bottom:-30px; transform:translateX(-50%); width:70%; height:60px; background:radial-gradient(ellipse,rgba(0,0,0,.18),transparent 70%); filter:blur(8px); z-index:-1; }
</style>
</head>
<body>
  <header>
    <div class="logo">4.5<b>room</b></div>
    <nav><a href="#">概要</a><a href="#">動画</a><a href="#">お問い合わせ</a></nav>
  </header>
  <section class="hero">
    <div class="eyebrow">iPad mini × EDC</div>
    <h1>ちょうどいいを、<br>持ち歩く。</h1>
    <p class="lead">毎日持ち歩く道具を、使い込んでから紹介する。顔出しなしの、ミニマルなガジェット＆文房具チャンネル。</p>
    <div class="links">
      <a href="#">チャンネル登録</a>
      <a href="#">最新の動画を見る</a>
    </div>
    <div class="stage">
      <img src="https://img.youtube.com/vi/-lp4D2pRV8w/maxresdefault.jpg"
           onerror="this.src='https://img.youtube.com/vi/-lp4D2pRV8w/hqdefault.jpg'" alt="">
    </div>
  </section>
</body>
</html>
