<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">
<meta property="og:title" content="4.5roomのイヤホンの物差し">
<meta property="og:description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://4-5room.com/earphones/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>4.5roomのイヤホンの物差し</title>
<meta name="theme-color" content="#fefefd" id="tc">
<script>
  // 昼夜: 選んだもの（localStorage・4-5room.com の /sale/ と同じキーで共有）→ なければ端末の設定。描く前に決めてちらつかせない
  (function () {
    var t = null;
    try { t = localStorage.getItem('sale-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('tc').content = t === 'dark' ? '#1a2750' : '#fefefd';
  })();
</script>
<link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  /* 公開版（2026-10-14 本人「イヤフォンに特化させたデザイン」→ 下絵3案から A「写真＋イコライザー」）
     /sale/ と同じ in living. の組み（白地・丸い小文字の英語・丸ゴシック・枠線なし・写真の台だけ薄い生成り）。
     イヤホンらしさは、採点の4つの段をイコライザーのつまみで、妥当な価格と実売を音量の横棒で見せるところに寄せる。
     段の色（見た目・音・機能・手間）は本人用と同じ4色。夜は /sale/ と同じ夜空 */
  :root {
    color-scheme: light;
    --paper: #fefefd; --tile: #f4f1ec; --ink: #2b2723; --sub: #8b8277; --faint: #bdb3a7; --rail: #efebe5;
    --sale: #d4583a; --sale-ink: #ffffff; --mint: #3c977a; --chip: #f2efea; --btn: var(--ink); --btn-ink: var(--paper); --mode-on: #ffffff;
    --knob: #ffffff; --sheet: #fefefd;
    --c-look: #d8a23a; --c-sound: #df6a3e; --c-func: #4b7bd1; --c-daily: #3a9c78;
    --en: "Quicksand", "Zen Maru Gothic", sans-serif;
    --jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0e1533; --tile: #eceff6; --ink: #f3f1ea; --sub: #a2aac4; --faint: #5d6687; --rail: rgba(255, 255, 255, .1);
    --sale: #ffd97a; --sale-ink: #161c3d; --mint: #8edbc2; --chip: rgba(255, 255, 255, .08);
    --btn: rgba(255, 255, 255, .1); --btn-ink: #f3f1ea; --mode-on: rgba(255, 255, 255, .18); --knob: #f3f1ea; --sheet: #121a3c;
    --c-look: #e9bd62; --c-sound: #f08a63; --c-func: #7fa6f0; --c-daily: #63c49f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--jp); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .num { font-family: var(--en); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 0; font-family: var(--en); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  .top .right { display: flex; align-items: center; gap: 14px; }
  .top .right > a { color: var(--sub); font-weight: 500; }
  .mode { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
  .mode button { all: unset; cursor: pointer; padding: 3px 11px; border-radius: 999px; font: 600 12.5px/1.4 var(--en); letter-spacing: .02em; color: var(--sub); }
  .mode button[aria-pressed="true"] { background: var(--mode-on); color: var(--ink); }
  .mode button:focus-visible { outline: 2px solid var(--sale); outline-offset: 1px; }

  .hero { text-align: center; padding: 26px 0 6px; }
  .arc { display: block; width: min(360px, 86%); height: auto; margin: 0 auto -6px; }
  .arc text { font-family: var(--en); font-weight: 600; font-size: 22px; letter-spacing: .14em; fill: var(--mint); }
  h1 { font-size: clamp(30px, 8vw, 52px); font-weight: 700; letter-spacing: .04em; line-height: 1.25; margin: 0; }
  .sub { margin: 14px auto 0; max-width: 32em; color: var(--sub); font-size: 14.5px; }
  .stats { display: flex; justify-content: center; gap: clamp(30px, 8vw, 70px); margin: 28px 0 4px; }
  .stat b { display: block; font-family: var(--en); font-weight: 700; font-size: clamp(40px, 10vw, 58px); line-height: 1; color: var(--mint); }
  .stat b small { font-size: .42em; margin-left: 2px; }
  .stat span { display: block; margin-top: 8px; font-size: 12.5px; color: var(--sub); }
  .stamp { display: inline-block; margin-top: 16px; font-family: var(--en); font-weight: 500; font-size: 13px; color: var(--sub); letter-spacing: .04em; }

  /* 今日いちばん割安（いま Amazon で買えるものの中から） */
  .best { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 116px 1fr; gap: 16px; align-items: center;
          width: min(560px, 100%); margin: 30px auto 0; padding: 12px 18px 12px 12px; border-radius: 26px; background: var(--chip); text-align: left; }
  .best .tile { border-radius: 18px; }
  .best .en { font-family: var(--en); font-weight: 600; color: var(--mint); font-size: 13.5px; letter-spacing: .06em; }
  .best .nm { font-weight: 700; font-size: 17px; line-height: 1.35; margin: 2px 0 4px; }
  .best .why { font-size: 13px; color: var(--sub); }
  .best .why b { font-family: var(--en); color: var(--ink); font-size: 16px; margin-right: 6px; }
  .best:focus-visible { outline: 2px solid var(--sale); outline-offset: 3px; }

  .disc { margin: 26px auto 0; max-width: 40em; text-align: center; color: var(--sub); font-size: 12px; }

  /* 絞り込みの帯 */
  .bar { position: sticky; top: 0; z-index: 5; margin: 22px -16px 0; padding: 10px 16px;
         background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .bar-in { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { all: unset; flex: none; cursor: pointer; padding: 8px 15px; border-radius: 999px; background: var(--chip); font-size: 13.5px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip:focus-visible, .sorts button:focus-visible { outline: 2px solid var(--sale); outline-offset: 2px; }
  .sortline { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 6px; color: var(--sub); font-size: 13px; }
  .sorts { display: flex; gap: 16px; }
  .sorts button { all: unset; cursor: pointer; padding: 2px 0; }
  .sorts button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
  [data-theme="dark"] .bar { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; transition: background-color .2s; }
  [data-theme="dark"] .bar.stuck { background: rgba(28, 42, 83, .97); }

  /* 機種のカード: 写真＋名前＋イコライザー／音量の横棒／値段と Amazon */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 26px; margin-top: 12px; }
  .card { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px 14px; align-content: start; cursor: pointer; border-radius: 22px; padding: 8px; margin: -8px;
          transition: background-color .18s; }
  .card:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
  .card:focus-visible { outline: 2px solid var(--sale); outline-offset: 2px; }
  .tile { position: relative; aspect-ratio: 1 / 1; border-radius: 20px; background: var(--tile); overflow: hidden; }
  .tile img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; font: 600 12px/1.4 var(--en); color: #b8afa3; letter-spacing: .04em; }
  .tile .off { position: absolute; left: 8px; top: 8px; background: var(--sale); color: var(--sale-ink); font: 700 13px/1 var(--en); padding: 6px 8px 5px; border-radius: 999px; }
  .tile .tag { position: absolute; left: 8px; bottom: 8px; background: #ffffff; color: #2b2723; font-size: 10.5px; padding: 3px 8px; border-radius: 999px; }
  .nm { font-weight: 700; font-size: 15.5px; line-height: 1.35; margin: 2px 0 0; }
  button.nm { all: unset; cursor: pointer; display: block; font-weight: 700; font-size: 15.5px; line-height: 1.35; margin-top: 2px; }
  button.nm:focus-visible { outline: 2px solid var(--sale); outline-offset: 2px; }
  .meta { margin: 2px 0 0; font-size: 11.5px; color: var(--sub); }
  .vd { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .vd.cheap { color: var(--mint); } .vd.fair { color: var(--sub); } .vd.pricey { color: var(--sale); }
  /* イコライザー: 段ごとの「満たした割合」をつまみの高さで */
  .eq { display: flex; gap: 10px; align-items: flex-end; margin-top: 8px; }
  .eq .b { width: 30px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .eq .rail { position: relative; width: 6px; height: 44px; border-radius: 9px; background: var(--rail); }
  .eq .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 9px; }
  .eq .knob { position: absolute; left: 50%; width: 14px; height: 14px; margin: 0 0 -7px -7px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
  .eq small { font-size: 9.5px; color: var(--sub); white-space: nowrap; }
  /* 音量の横棒: 緑＝私の基準での妥当な価格、赤い線＝実売（全機種で同じ目盛り） */
  .vol { grid-column: 1 / -1; }
  .vol .track { position: relative; height: 10px; border-radius: 99px; background: var(--chip); }
  .vol .fair { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--mint) 22%, transparent), var(--mint)); }
  .vol .act { position: absolute; top: -5px; width: 3px; height: 20px; margin-left: -1.5px; border-radius: 3px; background: var(--sale); }
  .vol .lab { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--sub); margin-top: 6px; }
  .buy { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .buy .pr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 7px; min-width: 0; }
  .buy b { font: 700 21px/1.2 var(--en); }
  .buy s { font: 500 12px var(--en); color: var(--faint); }
  .buy small { flex-basis: 100%; font-size: 11px; color: var(--sub); }
  .amz { flex: none; background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .amz:hover { background: var(--sale); color: var(--sale-ink); }
  .empty { text-align: center; color: var(--sub); padding: 36px 0; }

  /* 物差しのしくみ */
  .how { margin: 84px auto 0; max-width: 720px; }
  .how .head { text-align: center; }
  .how .head .en { font-family: var(--en); font-weight: 600; color: var(--mint); letter-spacing: .08em; }
  .how .head h2 { margin: 2px 0 6px; font-size: 22px; }
  .how .head p { margin: 0 auto; color: var(--sub); font-size: 13.5px; max-width: 34em; }
  .how .formula { margin: 22px auto 0; text-align: center; font-size: 15px; }
  .how .formula b { font-family: var(--en); }
  .tier { margin-top: 28px; }
  .tier-h { display: flex; align-items: baseline; gap: 10px; }
  .tier-h i { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  .tier-h b { font-size: 15.5px; }
  .tier-h span { color: var(--sub); font-size: 12.5px; }
  .tier-h .v { margin-left: auto; font-family: var(--en); font-weight: 600; color: var(--ink); font-size: 14px; }
  .w-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 4.5em; gap: 12px; align-items: center; margin-top: 8px; font-size: 13px; }
  .w-row .wb { height: 6px; border-radius: 9px; background: var(--rail); position: relative; overflow: hidden; }
  .w-row .wb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; }
  .w-row .y { text-align: right; font-family: var(--en); font-weight: 600; color: var(--sub); }
  .how .note { color: var(--sub); font-size: 12.5px; margin: 22px 0 0; }

  .notes { margin: 70px auto 0; max-width: 720px; padding-bottom: 70px; color: var(--sub); font-size: 12px; line-height: 1.8; }
  .notes p { margin: 0 0 8px; }

  /* 機種の詳しい画面（下から出る1枚） */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--sheet); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet[hidden] { display: none; }
  .sheet:focus { outline: none; }
  .sheet .in { max-width: 720px; margin: 0 auto; padding: 0 16px 70px; }
  .sheet .bk { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; margin: 0 -16px; padding: 14px 16px;
               background: color-mix(in srgb, var(--sheet) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .sheet .bk button { all: unset; cursor: pointer; font: 600 14px var(--en); padding: 6px 14px; border-radius: 999px; background: var(--chip); }
  .sheet .bk button:focus-visible { outline: 2px solid var(--sale); }
  .sheet .bk span { font: 600 13px var(--en); color: var(--sub); }
  .d-top { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 24px; align-items: center; margin-top: 6px; }
  .d-top .tile { border-radius: 26px; }
  .d-top .tile .off { font-size: 16px; padding: 8px 10px 7px; left: 12px; top: 12px; }
  .d-top h2 { margin: 0; font-size: 24px; line-height: 1.35; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .specs span { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--sub); }
  .price-box { margin-top: 30px; }
  .price-box .lab { font-size: 13px; color: var(--sub); }
  .price-box .big { display: block; font: 700 clamp(46px, 13vw, 64px)/1.05 var(--en); letter-spacing: -.01em; margin-top: 2px; }
  .price-box .big small { font-size: .45em; margin-right: 2px; }
  .price-box .vd { font-size: 15px; margin-top: 6px; }
  .price-box .vol { margin-top: 18px; }
  .price-box .vol .track { height: 14px; }
  .price-box .vol .act { top: -6px; height: 26px; width: 4px; margin-left: -2px; }
  .ticks { position: relative; height: 20px; margin-top: 6px; }
  .ticks span { position: absolute; transform: translateX(-50%); font: 500 11px var(--en); color: var(--faint); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .d-buy { display: flex; justify-content: center; align-items: baseline; gap: 10px; margin-top: 22px; padding: 15px 20px; border-radius: 999px;
           background: var(--btn); color: var(--btn-ink); font-weight: 500; font-size: 15px; }
  .d-buy b { font: 700 18px var(--en); }
  .d-buy:hover { background: var(--sale); color: var(--sale-ink); }
  .d-disc { color: var(--sub); font-size: 11.5px; margin: 10px 4px 0; line-height: 1.7; }
  .d-eq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 34px; text-align: center; }
  .d-eq .rail { position: relative; width: 8px; height: 110px; margin: 0 auto; border-radius: 9px; background: var(--rail); }
  .d-eq .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 9px; }
  .d-eq .knob { position: absolute; left: 50%; width: 22px; height: 22px; margin: 0 0 -11px -11px; border-radius: 50%; background: var(--knob); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  .d-eq b { display: block; margin-top: 14px; font-size: 12.5px; line-height: 1.35; }
  .d-eq span { display: block; font: 700 13px var(--en); margin-top: 4px; }
  .d-eq em { display: block; font: 500 11px var(--en); font-style: normal; color: var(--faint); }
  .abs { color: var(--sub); font-size: 12.5px; margin: 28px 0 0; }
  .d-tier { margin-top: 30px; }
  .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; }
  .it .lb { font-size: 14px; }
  .it .peer { grid-column: 1 / -1; font-size: 11.5px; color: var(--sub); }
  .it .peer { color: var(--faint); }
  .it .peer a { color: var(--sub); }
  .it .peer a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .dots { display: flex; align-items: center; gap: 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--rail); }
  .dots i.on { background: var(--tc); }
  .dots em { font-style: normal; font-size: 13px; font-weight: 700; min-width: 3.6em; text-align: right; color: var(--tc); }
  .dots em.no { color: var(--sub); font-weight: 500; }
  .pill { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--chip); }
  .pill.yes { background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--tc); font-weight: 700; }
  .mini { display: flex; align-items: center; gap: 10px; }
  .mini .wb { width: 90px; height: 6px; border-radius: 9px; background: var(--rail); position: relative; overflow: hidden; }
  .mini .wb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tc); border-radius: 9px; }
  .mini b { font: 700 14px var(--en); min-width: 3.6em; text-align: right; }
  .srcs { margin-top: 30px; font-size: 12px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
  .srcs a { text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 680px) {
    .grid { grid-template-columns: minmax(0, 1fr); gap: 30px; }
    .d-top { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .d-top .tile { width: min(300px, 100%); margin: 0 auto; }
    .d-top h2 { text-align: center; font-size: 22px; }
    .specs { justify-content: center; }
    .best { grid-template-columns: 96px 1fr; }
  }

  /* 夜空（/sale/ と同じ）: 宵の紺→夜の紺と月明かりのにじみ。星はページの頭だけ、文字のない所へ手で置く */
  [data-theme="dark"] body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 84% 4%, rgba(255, 233, 180, .13), transparent 28%), linear-gradient(180deg, #1d2b55 0%, #121b3f 42%, #0b1129 100%); }
  [data-theme="dark"] body::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 640px; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1px 1px at 28% 9px, rgba(255, 255, 255, .6) 40%, transparent) no-repeat,
      radial-gradient(1.2px 1.2px at 71% 7px, rgba(255, 255, 255, .7) 40%, transparent) no-repeat,
      radial-gradient(1.4px 1.4px at 9% 62px, rgba(255, 255, 255, .9) 40%, transparent) no-repeat,
      radial-gradient(1px 1px at 33% 58px, rgba(255, 255, 255, .6) 40%, transparent) no-repeat,
      radial-gradient(1.8px 1.8px at 52% 72px, #fff3cf 40%, transparent) no-repeat,
      radial-gradient(1px 1px at 68% 56px, rgba(255, 255, 255, .7) 40%, transparent) no-repeat,
      radial-gradient(1.2px 1.2px at 90% 78px, rgba(255, 255, 255, .8) 40%, transparent) no-repeat,
      radial-gradient(1px 1px at 5% 118px, rgba(255, 255, 255, .6) 40%, transparent) no-repeat,
      radial-gradient(2.2px 2.2px at 17% 104px, #fff3cf 40%, transparent) no-repeat,
      radial-gradient(1.4px 1.4px at 83% 112px, rgba(255, 255, 255, .85) 40%, transparent) no-repeat,

  if (k === "anc" && x !== "none" && ancDb(id) != null) return Math.min(1, Math.max(0, (ancDb(id) - DB_ZERO) / (DB_FULL - DB_ZERO)));
  if (it.type === "rate") return x == null || x === "unknown" ? 0.5 : x === "none" ? 0 : x === 3 ? 1.25 : (x + 2) / 4;
  if (it.type === "bool") return x == null ? 0.5 : x;
  const h = parseFloat(x);
  return isNaN(h) ? 0.5 : Math.min(1, Math.max(0, (h - 6) / 2));
}
function weights() {
  if (S.w) return S.w;
  const w = {};
  TIERS.forEach((t) => t.keys.forEach((k) => { w[k] = S.inc[t.id] / t.keys.length; }));
  return w;
}
const tierMax = (t) => t.keys.reduce((s, k) => s + (weights()[k] || 0), 0);
const tierGain = (id, t) => t.keys.reduce((s, k) => s + (weights()[k] || 0) * credit(id, k), 0);
const tierCredit = (id, t) => { const mx = tierMax(t); return mx ? tierGain(id, t) / mx : 0; };
const rawFair = (id, base, w) => base + Object.keys(ITEMS).reduce((s, k) => s + (w[k] || 0) * credit(id, k), 0);
const fair = (id) => Math.round(rawFair(id, S.base, weights()) / 100) * 100;
// 公開情報で決まる値（ANCなし＝「なし」など）も入力済みとして数える
function filled(id, k) {
  return val(id, k) != null || (k === "anc" && ancDb(id) != null);
}
const todoKeys = (id) => Object.keys(ITEMS).filter((k) => !filled(id, k));
function used(id) {
  const r = S.ratings[id];
  if (r && typeof r.used === "boolean") return r.used;
  return !!byId[id].used_default;
}
function rated(id) {
  return RATE_KEYS.filter((k) => filled(id, k)).length;
}
// 本人が1項目でも採点したか（公開情報だけの機種は割り振りの計算やランキングに入れない）
function hasRated(id) {
  const v = (S.ratings[id] && S.ratings[id].v) || {};
  return RATE_KEYS.some((k) => v[k] != null);
}
// 公開版の実売：Amazon の今の値段（prices.json・毎朝取り直す）→ 取れない機種は採点したときの実売
// 規約上、24 時間を過ぎた値段は出さない（取り直しが止まったら採点時の実売に戻る）
const LIVE_OK = !!(PRICES && Date.now() - Date.parse(PRICES.at) < 26 * 3600e3);
function livePrice(id) {
  const p = LIVE_OK ? PRICES.items[id] : null;
  return p && !p.out ? p : null;
}
function actualPrice(id) {
  if (PUBLIC && livePrice(id)) return livePrice(id).amount;
  const r = S.ratings[id];
  if (r && r.actual) return r.actual;
  return byId[id].price_jpy || null;
}
function verdict(id) {
  const a = actualPrice(id);
  if (!a) return { cls: "none", word: "価格不明", r: null };
  const r = a / fair(id);
  return r <= 0.9 ? { cls: "cheap", word: "割安", r } : r <= 1.1 ? { cls: "fair", word: "妥当", r } : { cls: "pricey", word: "割高", r };

// ===== 保存（db があればそちら。1文書ずつ順番に書く） =====
const pending = {}, chains = {};
function persist(id) {
  if (PUBLIC) return;
  saveLocal();
  if (!S.db || !S.canWrite) return;
  clearTimeout(pending[id]);
  pending[id] = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(S.ratings[id]));
    chains[id] = (chains[id] || Promise.resolve()).then(() => S.db.doc("ratings/" + id).set(body)).catch(onWriteError);
  }, 700);
}
function persistInc() {
  if (PUBLIC) return;
  saveLocal();
  if (!S.db || !S.canWrite) return;
  clearTimeout(pending._inc);
  pending._inc = setTimeout(() => {
    const body = { inc: { ...S.inc }, base: S.base, w: S.w ? { ...S.w } : null };
    chains._inc = (chains._inc || Promise.resolve()).then(() => S.db.doc("settings/ruler").set(body)).catch(onWriteError);
  }, 700);
}
function onWriteError(e) {
  if (e && (e.code === "invalid_argument" || e.code === "not_granted")) {
    S.canWrite = false;
    toast("この表示では保存できません（閲覧のみ）");
  } else if (e && e.code === "quota_exceeded") {
    toast("保存の上限に達しました");
  } else {
    toast("保存に失敗しました。もう一度タップしてください");
  }
}
function setVal(id, k, x) {
  const r = S.ratings[id] || (S.ratings[id] = { v: {}, actual: null });
  r.v = { ...r.v, [k]: x };

  persist(id);
  render();
}

    if (sel != null && pe.length) peer = `同じ「${RATE_WORD[x]}」：${pe.map((o) => `<a href="#${o}" data-open="${o}">${esc(byId[o].name)}</a>`).join("・")}`;
  }
  return `<div class="it" style="--tc:${tc}"><span class="lb">${esc(it.label)}</span>${right}${peer ? `<span class="peer">${peer}</span>` : ""}</div>`;
}
function detailHTML(id) {
  const m = byId[id], f = fair(id), a = actualPrice(id), p = livePrice(id), sc = scaleFor(Math.max(f, a || 0));
  const ticks = []; for (let x = 0; x <= sc.R; x += sc.step) ticks.push(`<span style="left:${pct(x, sc.R)}%">${x ? yen(x) : "¥0"}</span>`);
  return `<div class="in">
    <div class="bk"><button type="button" id="close">← 一覧</button><span>earphones</span></div>
    <div class="d-top">${tileHTML(id, true)}<div><h2>${esc(m.name)}</h2><div class="specs">${specChips(m)}</div></div></div>
    <div class="price-box">
      <span class="lab">私の基準での妥当な価格</span>
      <span class="big"><small>¥</small>${yen(f)}</span>
      ${vdHTML(id, true)}
      <div class="vol"><div class="track"><div class="fair" style="width:${pct(f, sc.R)}%"></div>${a ? `<div class="act" style="left:${pct(a, sc.R)}%"></div>` : ""}</div>
        <div class="ticks">${ticks.join("")}</div>
        <div class="lab"><span>${a ? `赤い線＝実売 ¥${yen(a)}（${p ? `Amazon ${liveAt()}` : `${snapAt()} 時点`}）` : "実売は不明"}</span><span>緑＝妥当 ¥${yen(f)}</span></div></div>
    </div>
    <a class="d-buy" href="${esc(amazonUrl(m))}" target="_blank" rel="sponsored noopener">${AMAZON[m.id] ? "Amazonで見る" : "Amazonで探す"}${p ? `<b>¥${yen(p.amount)}</b>${p.pct ? `<span>−${p.pct}%</span>` : ""}` : ""}</a>
    ${p ? `<p class="d-disc">価格および発送可能時期は表示された日付・時刻（${liveAt()}）の時点のものであり、変更される場合があります。本商品の購入においては、購入の時点でAmazon.co.jpに表示されている価格および発送可能時期の情報が適用されます。${p.badge ? `「${esc(p.badge)}」の値段はプライム会員向けの場合があります。` : ""}</p>` : ""}
    <p class="d-disc" style="margin-top:4px">Amazonのアソシエイトとして、4.5roomは適格販売により収入を得ています。</p>
    <div class="d-eq">${eqHTML(id, true)}</div>
    <p class="abs">採点は値段を考えずに、モノとしての出来で付けています（絶対評価）。</p>
    ${TIERS.map((t) => `<div class="d-tier"><div class="tier-h"><i style="background:${TIER_C[t.id]}"></i><b>${t.name}</b><span>〜¥${yen(t.line)} の線</span>
      <span class="v">+¥${yen(Math.round(tierGain(id, t) / 100) * 100)} / ¥${yen(tierMax(t))}</span></div>${t.keys.map((k) => itemHTML(id, k)).join("")}</div>`).join("")}
    ${(m.sources || []).length ? `<div class="srcs"><span>公開情報の出典</span>${m.sources.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, "").slice(0, 60))}</a>`).join("")}</div>` : ""}
    ${m.price_note && !p ? `<p class="d-disc">実売のメモ：${esc(m.price_note)}</p>` : ""}
  </div>`;
}
let sheetId = null;
function showSheet(id) {
  sheetId = id && byId[id] ? id : null;
  if (!sheetId) { $sheet.hidden = true; document.documentElement.style.overflow = ""; return; }
  $sheet.innerHTML = detailHTML(sheetId);
  $sheet.hidden = false; $sheet.scrollTop = 0;
  document.documentElement.style.overflow = "hidden";
  document.getElementById("close").onclick = closeSheet;
  $sheet.querySelectorAll("[data-open]").forEach((x) => x.onclick = (e) => { e.preventDefault(); openSheet(x.dataset.open, true); });
  $sheet.focus({ preventScroll: true });
}
// 機種ごとに URL の # を変える（戻るボタンで一覧に戻れる・共有できる）
function openSheet(id, replace) {
  if (replace) history.replaceState({ m: id }, "", "#" + id); else history.pushState({ m: id }, "", "#" + id);
  showSheet(id);
}
function closeSheet() {
  if (history.state && history.state.m) history.back();
  else { history.replaceState(null, "", location.pathname + location.search); showSheet(null); }
}
window.addEventListener("popstate", () => showSheet(decodeURIComponent(location.hash.slice(1))));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetId) closeSheet(); });

let drawn = false;
function render() {
  if (!drawn) { renderList(); drawn = true; }
  showSheet(decodeURIComponent(location.hash.slice(1)));
}

// 昼夜の切り替え（右上）。選んだら覚える。選ぶまでは端末の設定が変わったら付いていく
(() => {
  const root = document.documentElement, tc = document.getElementById("tc"), mq = matchMedia("(prefers-color-scheme: dark)");
  let chosen = null;
  try { chosen = localStorage.getItem("sale-theme"); } catch (e) {}
  function theme(t) {
    root.setAttribute("data-theme", t);
    if (tc) tc.content = t === "dark" ? "#1a2750" : "#fefefd";
    document.querySelectorAll(".mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === t)));
  }
  theme(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
  document.querySelectorAll(".mode button").forEach((b) => b.addEventListener("click", () => {
    chosen = b.dataset.mode;
    try { localStorage.setItem("sale-theme", chosen); } catch (e) {}
    if (root.getAttribute("data-theme") === chosen) return;
    const go = () => theme(chosen);
    if (document.startViewTransition && !calm()) document.startViewTransition(go); else go();
  }));
  mq.addEventListener("change", (e) => { if (chosen !== "light" && chosen !== "dark") theme(e.matches ? "dark" : "light"); });
})();
let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000);
}

if (PUBLIC) {
  document.body.classList.add("ro");
  document.getElementById("sync-t").textContent = "採点 " + SNAPSHOT.at + " 時点";
}
render();

// 中身が同じか（キーの順番は問わない）
function same(a, b) {
  const norm = (x) => x && typeof x === "object"
    ? (Array.isArray(x) ? x.map(norm) : Object.fromEntries(Object.keys(x).sort().map((k) => [k, norm(x[k])])))
    : x;
  return JSON.stringify(norm(a)) === JSON.stringify(norm(b));
}

// ===== 保存先：db が使えれば、端末をまたいで残る =====
(async () => {
  if (PUBLIC || !window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db) return;
  S.db = db;
  if (user) {
    const w = await user.can("data.write");
    if (w === false) S.canWrite = false;
  }
  const sync = document.getElementById("sync");
  document.getElementById("sync-t").textContent = S.canWrite ? "クラウドに保存" : "閲覧のみ";
  sync.classList.add("on");
  let first = true;
  db.collection("ratings").onSnapshot((snap) => {
    const remote = {};
    let changed = false;
    snap.docs.forEach((d) => { if (d.exists) remote[d.id] = d.data(); });
    // 初回：db が空でこの端末に採点があれば、それを db へ上げる
    if (first && snap.empty && S.canWrite) {
      Object.keys(S.ratings).forEach((id) => persist(id));
    } else {
      Object.entries(remote).forEach(([id, body]) => {
        const mine = S.ratings[id];
        if ((!mine || !mine.at || (body.at && body.at >= mine.at)) && !same(mine, body)) {
          S.ratings[id] = JSON.parse(JSON.stringify(body));
          changed = true;
        }
      });
    }
    first = false;
    saveLocal();
    // 入力中の欄を壊さないよう、詳細では入力欄にフォーカスがなければ描き直す
    if (changed && !(document.activeElement && document.activeElement.tagName === "INPUT")) render();
  }, () => {});
  db.doc("settings/ruler").onSnapshot((d) => {
    if (d.exists && d.data()) {
      const b = d.data(), before = { inc: S.inc, w: S.w, base: S.base };
      S.inc = { ...S.inc, ...b.inc };
      S.w = b.w || null;
      if (b.base != null) S.base = b.base;
      if (S.view.name !== "ruler" && !same(before, { inc: S.inc, w: S.w, base: S.base })) render();
    }
  }, () => {});
})();
