<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">
<meta property="og:title" content="4.5roomのイヤホンの物差し">
<meta property="og:description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>4.5roomのイヤホンの物差し</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* 公開版 v3.1（2026-10-15 本人「MPCっぽいデザイン」→「見づらくね？」「もっと洗練された感じのMPC」）
     ページを1台のサンプラーに見立てる：画面＝選んだ機種、4×4 のパッド＝機種、4つのつまみ＝採点の4つの段、バンク A/B＝16機種ずつ。
     洗練の方針：立体の影・グラデーション・光る輪はやめて、黒いアルマイトの平らな面と 1px の細い線だけで組む。
     色は意味のあるところだけ：割安＝ミント（チャンネルの見出しのミント）・妥当＝白・割高＝琥珀、赤は 4.5room のバッジと「いま」の線だけ */
  :root {
    color-scheme: dark;
    --room: #0a0a0b; --body: #141416; --plate: #1c1c1f; --plate2: #222226; --well: #0e0f11;
    --hair: rgba(255, 255, 255, .08); --hair2: rgba(255, 255, 255, .14);
    --ink: #f4f4f2; --sub: #b6b6bc; --dim: #808087;
    --cheap: #5ec8a8; --fair: #e8e8e3; --pricey: #f2a54a; --none: #6a6a71; --red: #e3262b;
    --c-look: #e3b44f; --c-sound: #ec7c56; --c-func: #7aa2ee; --c-daily: #5ec8a8;
    --en: "Inter", "Helvetica Neue", Arial, sans-serif;
    --jp: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--room); color: var(--ink); font-family: var(--jp); line-height: 1.6; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-family: var(--en); font-variant-numeric: tabular-nums; }
  .silk { font: 500 10.5px/1 var(--en); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 18px; }
  .badge { display: inline-flex; align-items: center; gap: 12px; }
  .badge b { background: var(--red); color: #fff; font: 700 14px/1 var(--en); letter-spacing: -.01em; padding: 6px 8px; border-radius: 3px; }
  .badge span { font: 500 12px/1 var(--en); letter-spacing: .18em; text-transform: uppercase; color: var(--sub); }
  .top > a { font: 500 12px var(--en); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .lead { margin: 0 0 20px; max-width: 46em; font-size: 14.5px; color: var(--sub); line-height: 1.75; }
  .lead b { color: var(--ink); font-weight: 500; }

  /* 本体：平らな黒い面に 1px の線 */
  .mpc { background: var(--body); border: 1px solid var(--hair); border-radius: 26px; padding: 16px; }
  .mpc-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .left, .right, .ctrl { min-width: 0; }

  /* 画面（選んだ機種） */
  .bezel { border-radius: 16px; background: #050506; padding: 4px; }
  .screen { background: var(--well); border: 1px solid var(--hair); border-radius: 13px; overflow: hidden; }
  .sbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--hair); font: 500 11px var(--en); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .sbar b { color: var(--ink); font-weight: 600; }
  .sbody { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 14px; align-items: center; }
  .shot { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; background: #f3f3f1; overflow: hidden; }
  .shot img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; }
  .shot .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10px; font: 600 11px/1.3 var(--en); color: #9a9a9f; letter-spacing: .1em; text-transform: uppercase; }
  .shot .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(17, 17, 17, .86); color: #fff; font-size: 10.5px; padding: 2px 7px; border-radius: 4px; }
  .s-maker { font: 500 11px var(--en); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .s-name { margin: 3px 0 0; font-size: 17px; font-weight: 500; line-height: 1.35; letter-spacing: .01em; }
  .s-big { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  .s-big b { font: 500 46px/1 var(--en); letter-spacing: -.035em; color: var(--glow); }
  .s-big b small { font-size: .42em; font-weight: 500; letter-spacing: 0; margin-left: 2px; }
  .s-big span { font-size: 12px; color: var(--dim); line-height: 1.45; }
  .s-big span em { font-style: normal; display: block; color: var(--glow); font-weight: 500; font-size: 13.5px; }
  /* 値段の線（波形の画面のつもり）: 帯＝0〜妥当な価格、赤い線＝いまの値段 */
  .wave { position: relative; margin: 0 14px; height: 30px; }
  .wave .reg { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--cheap) 10%, transparent); border-right: 1px solid var(--cheap); }
  .wave svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wave .head { position: absolute; top: -3px; bottom: -3px; width: 1.5px; margin-left: -.75px; background: var(--red); }
  .wlab { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px 0; font-size: 12.5px; color: var(--dim); }
  .wlab b { font: 500 15px var(--en); color: var(--ink); margin-left: 6px; letter-spacing: -.01em; }
  .wlab .now b { color: #ff6b6e; }
  .sbtn { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px; }
  .s-amz { display: flex; justify-content: center; align-items: baseline; gap: 8px; height: 44px; align-items: center; border-radius: 10px; background: var(--ink); color: #0a0a0b; font-weight: 500; font-size: 14px; }
  .s-amz b { font: 600 15.5px var(--en); letter-spacing: -.01em; }
  .s-amz small { font: 500 12px var(--en); color: #6b6b70; }
  .s-more { all: unset; cursor: pointer; display: grid; place-items: center; padding: 0 16px; border-radius: 10px; border: 1px solid var(--hair2); font-size: 13.5px; color: var(--ink); }
  .s-more:hover { background: var(--plate); }
  .s-amz:focus-visible, .s-more:focus-visible { outline: 2px solid var(--cheap); outline-offset: 2px; }

  /* つまみ（採点の4つの段） */
  .qlink { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 14px 0 2px; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .knob svg { width: 52px; height: 52px; }
  .knob .k-l { font-size: 12px; font-weight: 500; color: var(--sub); }
  .knob .k-v { font: 500 12px var(--en); color: var(--ink); letter-spacing: -.01em; }

  /* 本体のボタン（検索・メーカー・形・並び順・パッドバンク） */
  .ctrl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .field { position: relative; }
  .field input { all: unset; display: block; box-sizing: border-box; width: 100%; height: 44px; padding: 0 40px 0 40px; border-radius: 10px; background: var(--well); border: 1px solid var(--hair);
                 font-size: 16px; color: var(--ink); }
  .field input::placeholder { color: var(--dim); }
  .field input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .field input:focus-visible { border-color: var(--cheap); }
  .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .field .clr { all: unset; cursor: pointer; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; color: var(--sub); font-size: 18px; }
  .field .clr[hidden] { display: none; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .sel { position: relative; min-width: 0; }
  .sel select { all: unset; display: block; box-sizing: border-box; width: 100%; height: 48px; padding: 18px 30px 0 12px; border-radius: 10px; cursor: pointer;
                background: var(--plate); border: 1px solid var(--hair); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel .silk { position: absolute; left: 13px; top: 9px; pointer-events: none; font-size: 9.5px; }
  .sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--sub); border-bottom: 1.5px solid var(--sub); transform: translateY(-30%) rotate(45deg); pointer-events: none; }
  .sel select:focus-visible { outline: 2px solid var(--cheap); outline-offset: 2px; }
  .sel option { background: #1c1c1f; color: var(--ink); }
  .btns { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .grp { display: flex; flex-direction: column; gap: 7px; }
  .grp .keys { display: flex; gap: 6px; }
  .hk { all: unset; cursor: pointer; position: relative; height: 36px; padding: 0 12px 0 22px; display: inline-flex; align-items: center; border-radius: 9px;
        background: var(--plate); border: 1px solid var(--hair); font-size: 13px; white-space: nowrap; color: var(--sub); }
  .hk::before { content: ""; position: absolute; left: 10px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #3b3b41; }
  .hk[aria-pressed="true"] { color: var(--ink); border-color: var(--hair2); background: var(--plate2); }
  .hk[aria-pressed="true"]::before { background: var(--red); }
  .hk:focus-visible { outline: 2px solid var(--cheap); outline-offset: 2px; }
  .hk[disabled] { opacity: .3; cursor: default; }

  /* パッド：平らな四角。色は数字と小さな点だけ */
  .pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .pad { all: unset; box-sizing: border-box; cursor: pointer; position: relative; aspect-ratio: 1 / 1; border-radius: 12px; padding: 9px 9px 9px; display: flex; flex-direction: column; justify-content: space-between;
         background: var(--plate); border: 1px solid var(--hair); overflow: hidden; transition: background-color .15s, border-color .15s; }
  .pad:hover { background: var(--plate2); }
  .pad .pn { display: flex; justify-content: space-between; align-items: center; font: 500 10.5px var(--en); color: var(--dim); letter-spacing: .04em; }
  .pad .pn i { width: 6px; height: 6px; border-radius: 50%; background: var(--glow); }
  .pad .pt { font-size: 12.5px; font-weight: 500; line-height: 1.25; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .pad .pp { font: 500 22px/1 var(--en); letter-spacing: -.03em; color: var(--glow); }
  .pad .pp small { font-size: 11px; letter-spacing: 0; margin-left: 1px; }
  .pad.on { background: var(--plate2); border-color: var(--ink); }
  .pad.on .pt { color: var(--ink); }
  .pad.on::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; pointer-events: none; background: linear-gradient(0deg, color-mix(in srgb, var(--glow) 16%, transparent), transparent); }
  .pad.off { cursor: default; background: transparent; border-style: dashed; border-color: rgba(255, 255, 255, .05); }
  .pad:focus-visible { outline: 2px solid var(--cheap); outline-offset: 2px; }
  .padhead { display: flex; justify-content: space-between; align-items: center; margin: 16px 2px 10px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); }
  .legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .empty { text-align: center; color: var(--sub); padding: 30px 0; font-size: 14px; }

  @media (min-width: 900px) {
    .mpc { padding: 22px; }
    .mpc-in { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 26px; align-items: start; }
    .left { position: sticky; top: 16px; }
    .sbody { grid-template-columns: 184px minmax(0, 1fr); gap: 20px; padding: 18px; }
    .s-name { font-size: 20px; }
    .s-big b { font-size: 60px; }
    .pad { padding: 11px; }
    .pad .pt { font-size: 13.5px; }
    .pad .pp { font-size: 27px; }
  }
  /* スマホ：画面とつまみを上に貼り付けて、パッドを押しながら見られるように */
  @media (max-width: 899px) {
    .left { position: sticky; top: 0; z-index: 4; margin: -16px -16px 0; padding: 12px 16px 12px; border-radius: 26px 26px 0 0; background: var(--body); border-bottom: 1px solid var(--hair); }
    .sbody { grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px; }
    .s-name { font-size: 15px; }
    .s-big b { font-size: 38px; }
    .wave { margin: 0 12px; height: 26px; }
    .wlab { padding: 6px 12px 0; }
    .sbtn { padding: 12px; }
    .qlink { padding-top: 10px; }
    .qlink .knob svg { width: 42px; height: 42px; }
    .pads { gap: 6px; }
    .pad { padding: 7px; border-radius: 10px; }
    .pad .pt { font-size: 11px; line-height: 1.2; }
    .pad .pp { font-size: 19px; }
    .pad .pn { font-size: 9.5px; }
    .hk { padding: 0 9px 0 18px; font-size: 12.5px; }
    .hk::before { left: 8px; }
    .grp .keys { gap: 5px; }
    .btns { gap: 8px; }
  }

  /* 物差しのしくみ（取扱説明書） */
  .manual { margin: 56px 0 0; max-width: 760px; }
  .manual h2 { margin: 8px 0 4px; font-size: 20px; font-weight: 500; }
  .manual p { color: var(--sub); font-size: 14px; margin: 8px 0 0; line-height: 1.8; }
  .manual .formula { color: var(--ink); font-size: 15px; margin-top: 16px; }
  .tier { margin-top: 26px; }
  .tier-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); }
  .tier-h i { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  .tier-h b { font-size: 15px; font-weight: 500; }
  .tier-h span { color: var(--dim); font-size: 12px; }
  .tier-h .v { margin-left: auto; font: 500 14px var(--en); color: var(--ink); }
  .w-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 4.2em; gap: 12px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--sub); }
  .seg { display: flex; gap: 2px; }
  .seg i { flex: 1; height: 6px; border-radius: 1px; background: #26262a; }
  .seg i.on { background: var(--tc); }
  .w-row .y { text-align: right; font: 500 13.5px var(--en); color: var(--ink); }
  .notes { margin: 48px 0 0; max-width: 760px; padding: 20px 0 64px; border-top: 1px solid var(--hair); color: var(--dim); font-size: 12px; line-height: 1.85; }
  .notes p { margin: 0 0 8px; }

  /* 機種の詳しい画面（TRACK VIEW） */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--room); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet[hidden] { display: none; }
  .sheet:focus { outline: none; }
  .sheet .in { max-width: 760px; margin: 0 auto; padding: 0 16px 72px; }
  .sheet .bk { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; margin: 0 -16px; padding: 12px 16px; background: rgba(10, 10, 11, .9);
               -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); }
  .sheet .bk .hk { padding-left: 12px; }
  .sheet .bk .hk::before { display: none; }
  .d-top { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 18px; }
  .d-top h2 { margin: 4px 0 0; font-size: 21px; font-weight: 500; line-height: 1.35; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .specs span { border: 1px solid var(--hair); border-radius: 6px; padding: 2px 9px; font-size: 12px; color: var(--sub); }
  .d-box { margin-top: 22px; }
  .d-box .screen { padding-bottom: 14px; }
  .d-fair { padding: 16px 14px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .d-fair > b { font: 500 40px/1 var(--en); letter-spacing: -.035em; }
  .ticks { position: relative; height: 16px; margin: 6px 14px 0; }
  .ticks span { position: absolute; transform: translateX(-50%); font: 500 10.5px var(--en); color: var(--dim); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .d-amz { display: flex; justify-content: center; align-items: center; gap: 10px; height: 52px; margin-top: 14px; border-radius: 12px; background: var(--ink); color: #0a0a0b; font-weight: 500; }
  .d-amz b { font: 600 17px var(--en); }
  .d-amz span { font: 500 13px var(--en); color: #6b6b70; }
  .d-disc { color: var(--dim); font-size: 11.5px; margin: 10px 2px 0; line-height: 1.75; }
  .d-q { margin-top: 24px; border: 1px solid var(--hair); border-radius: 16px; padding: 4px 8px 14px; }
  .d-tier { margin-top: 28px; }
  .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hair); }
  .it .lb { font-size: 14.5px; }
  .it .peer { grid-column: 1 / -1; font-size: 12px; color: var(--dim); }
  .it .peer a { color: var(--sub); }
  .lvl { display: flex; align-items: center; gap: 10px; }
  .lvl .seg { width: 104px; }
  .lvl em { font-style: normal; font-size: 13.5px; font-weight: 500; min-width: 3.8em; text-align: right; color: var(--tc); }
  .lvl em.no { color: var(--dim); }
  .led { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--dim); }
  .led i { width: 7px; height: 7px; border-radius: 50%; background: #2f2f34; }
  .led.on i { background: var(--tc); }
  .led.on { color: var(--tc); }
  .srcs { margin-top: 28px; font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
  .srcs a { color: var(--sub); text-decoration: underline; text-decoration-color: var(--hair2); text-underline-offset: 3px; word-break: break-all; }
  @media (max-width: 560px) { .d-top { grid-template-columns: 108px minmax(0, 1fr); gap: 14px; } .d-top h2 { font-size: 18px; } .d-fair > b { font-size: 34px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="badge"><b>4.5room</b><span>earphone ruler</span></span><a href="https://www.youtube.com/channel/UCdxzGFZI8g1MT3vUCprx_vw" rel="noopener">youtube</a></div>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="機種の採点" tabindex="-1" hidden></div>
<!-- 本人用と共通の起動部分が触る要素（公開版では見せない） -->
<span id="sync" hidden><span id="sync-t"></span></span>
<div id="toast" role="status" hidden></div>

  if (k === "anc" && x !== "none" && ancDb(id) != null) return Math.min(1, Math.max(0, (ancDb(id) - DB_ZERO) / (DB_FULL - DB_ZERO)));
  if (it.type === "rate") return x == null || x === "unknown" ? 0.5 : x === "none" ? 0 : x === 3 ? 1.25 : (x + 2) / 4;
  if (it.type === "bool") return x == null ? 0.5 : x;
  const h = parseFloat(x);
  return isNaN(h) ? 0.5 : Math.min(1, Math.max(0, (h - 6) / 2));
}
function weights() {
  if (S.w) return S.w;
  const w = {};
  TIERS.forEach((t) => t.keys.forEach((k) => { w[k] = S.inc[t.id] / t.keys.length; }));
  return w;
}
const tierMax = (t) => t.keys.reduce((s, k) => s + (weights()[k] || 0), 0);
const tierGain = (id, t) => t.keys.reduce((s, k) => s + (weights()[k] || 0) * credit(id, k), 0);
const tierCredit = (id, t) => { const mx = tierMax(t); return mx ? tierGain(id, t) / mx : 0; };
const rawFair = (id, base, w) => base + Object.keys(ITEMS).reduce((s, k) => s + (w[k] || 0) * credit(id, k), 0);
const fair = (id) => Math.round(rawFair(id, S.base, weights()) / 100) * 100;
// 公開情報で決まる値（ANCなし＝「なし」など）も入力済みとして数える
function filled(id, k) {
  return val(id, k) != null || (k === "anc" && ancDb(id) != null);
}
const todoKeys = (id) => Object.keys(ITEMS).filter((k) => !filled(id, k));
function used(id) {
  const r = S.ratings[id];
  if (r && typeof r.used === "boolean") return r.used;
  return !!byId[id].used_default;
}
function rated(id) {
  return RATE_KEYS.filter((k) => filled(id, k)).length;
}
// 本人が1項目でも採点したか（公開情報だけの機種は割り振りの計算やランキングに入れない）
function hasRated(id) {
  const v = (S.ratings[id] && S.ratings[id].v) || {};
  return RATE_KEYS.some((k) => v[k] != null);
}
// 公開版の実売：Amazon の今の値段（prices.json・毎朝取り直す）→ 取れない機種は採点したときの実売
// 規約上、24 時間を過ぎた値段は出さない（取り直しが止まったら採点時の実売に戻る）
const LIVE_OK = !!(PRICES && Date.now() - Date.parse(PRICES.at) < 26 * 3600e3);
function livePrice(id) {
  const p = LIVE_OK ? PRICES.items[id] : null;
  return p && !p.out ? p : null;
}
function actualPrice(id) {
  if (PUBLIC && livePrice(id)) return livePrice(id).amount;
  const r = S.ratings[id];
  if (r && r.actual) return r.actual;
  return byId[id].price_jpy || null;
}
function verdict(id) {
  const a = actualPrice(id);
  if (!a) return { cls: "none", word: "価格不明", r: null };
  const r = a / fair(id);
  return r <= 0.9 ? { cls: "cheap", word: "割安", r } : r <= 1.1 ? { cls: "fair", word: "妥当", r } : { cls: "pricey", word: "割高", r };
}

// ===== 保存（db があればそちら。1文書ずつ順番に書く） =====
const pending = {}, chains = {};
function persist(id) {
  if (PUBLIC) return;
  saveLocal();
  if (!S.db || !S.canWrite) return;
  clearTimeout(pending[id]);
  pending[id] = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(S.ratings[id]));
    chains[id] = (chains[id] || Promise.resolve()).then(() => S.db.doc("ratings/" + id).set(body)).catch(onWriteError);
  }, 700);
}
function persistInc() {
  if (PUBLIC) return;
  saveLocal();
  if (!S.db || !S.canWrite) return;
  clearTimeout(pending._inc);
  pending._inc = setTimeout(() => {
    const body = { inc: { ...S.inc }, base: S.base, w: S.w ? { ...S.w } : null };
    chains._inc = (chains._inc || Promise.resolve()).then(() => S.db.doc("settings/ruler").set(body)).catch(onWriteError);
  }, 700);
}
function onWriteError(e) {
  if (e && (e.code === "invalid_argument" || e.code === "not_granted")) {
    S.canWrite = false;
    toast("この表示では保存できません（閲覧のみ）");
  } else if (e && e.code === "quota_exceeded") {
    toast("保存の上限に達しました");
  } else {
    toast("保存に失敗しました。もう一度タップしてください");
  }
}
function setVal(id, k, x) {
  const r = S.ratings[id] || (S.ratings[id] = { v: {}, actual: null });
  r.v = { ...r.v, [k]: x };
  r.at = new Date().toISOString();
  persist(id);
  render();
}

// ===== 公開版の描画 v3（4-5room.com/earphones/・2026-10-15 本人「MPCっぽいデザイン」「検索窓とメーカーごとも」）=====
// 本人用（new_render.js）とは別。計算（fair・verdict・tierGain など）は本人用と共通のものを使う。
// ページを1台のサンプラーに見立てる：画面＝選んだ機種／4×4 のパッド＝機種（光る色で割安・妥当・割高）／つまみ＝採点の4つの段。
// 機種の詳しい画面（TRACK VIEW）は「詳しく」かパッドの長押しではなく、画面の「詳しく」ボタンから開く（URL の # に機種）
const $view = document.getElementById("view"), $sheet = document.getElementById("sheet");
const TIER_C = { look: "var(--c-look)", sound: "var(--c-sound)", func: "var(--c-func)", daily: "var(--c-daily)" };
const TIER_SHORT = { look: "見た目", sound: "音", func: "機能", daily: "手間" };
const GLOW = { cheap: "var(--cheap)", fair: "var(--fair)", pricey: "var(--pricey)", none: "var(--none)" };
const tierOf = Object.fromEntries(TIERS.flatMap((t) => t.keys.map((k) => [k, t])));
const calm = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const AMAZON_TAG = "srice-22";
function amazonUrl(m) {
  const asin = AMAZON[m.id];
  if (asin) return `https://www.amazon.co.jp/dp/${asin}?tag=${AMAZON_TAG}`;
  return `https://www.amazon.co.jp/s?k=${encodeURIComponent(m.name.replace(/[（(].*?[)）]/g, "").trim())}&tag=${AMAZON_TAG}`;
}
const P = (id) => (PRICES && PRICES.items[id]) || {};          // 画像は値段の鮮度に関係なく使う
const imgOf = (id) => P(id).img || null;
const snapAt = () => SNAPSHOT.at.slice(5).split("-").map(Number).join("/");
const liveAt = () => { const d = new Date(PRICES.at); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
const stamp = () => { const d = new Date(PRICES.at); return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

// 形（DATA の form を5つにまとめる）
const GROUPS = [["canal", "カナル型"], ["inner", "インナーイヤー"], ["open", "オープン・イヤーカフ"], ["wired", "有線"], ["head", "ヘッドホン"]];
function groupOf(m) {
  const f = m.form || "";
  if (/ヘッドホン/.test(f)) return "head";
  if (/有線/.test(f)) return "wired";
  if (/イヤーカフ|オープン|耳掛け/.test(f)) return "open";
  if (/インナーイヤー/.test(f)) return "inner";
  return "canal";
}
const wtTxt = (m) => m.weight_g ? `${groupOf(m) === "head" ? "重さ" : "片耳"} ${m.weight_g}g` : null;
// パッドに載せる短い名前（メーカー名とかっこ書きを外す）
function shortName(m) {
  // かっこは内側から外す（「(動画では『全度1』)」のような入れ子があるため）
  let s = m.name, prev;
  do { prev = s; s = s.replace(/[（(『][^（(『）)』]*[）)』]/g, ""); } while (s !== prev);
  s = s.replace(/\s+/g, " ").trim();
  const mk = (m.maker || "").trim();
  if (mk && s.toLowerCase().startsWith(mk.toLowerCase() + " ")) s = s.slice(mk.length + 1);
  return s.replace(/^Soundcore /, "") || m.name;
}
// 検索：全角半角・カタカナひらがな・空白と記号をそろえる。英字のメーカー名はカタカナでも引けるように（読みが確かなものだけ）
const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s・\-()（）\[\]「」『』、。,\/]/g, "");
const ALIAS = { anker: "アンカー", soundcore: "サウンドコア", soundpeats: "サウンドピーツ", earfun: "イヤーファン", apple: "アップル", airpods: "エアーポッズ エアポッズ",
  jabra: "ジャブラ", qcy: "キューシーワイ", acefast: "エースファスト", truefree: "トゥルーフリー", moondrop: "ムーンドロップ", liberty: "リバティ" };
const ids = models.map((m) => m.id).filter((id) => used(id));
const KW = Object.fromEntries(ids.map((id) => {
  const m = byId[id], k = norm([m.name, m.maker, m.form].join(" "));
  return [id, k + Object.entries(ALIAS).filter(([e]) => k.includes(e)).map(([, v]) => norm(v)).join("")];
}));
const MAKERS = [...new Set(ids.map((id) => byId[id].maker).filter(Boolean))]
  .map((mk) => [mk, ids.filter((id) => byId[id].maker === mk).length]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

function scaleFor(v) {
  const top = Math.max(10000, v * 1.1), step = top <= 20000 ? 5000 : 10000;
  return { R: Math.ceil(top / step) * step, step };
}
const pct = (v, R) => Math.min(100, Math.max(0, v / R * 100)).toFixed(2);
const vcls = (id) => verdict(id).r ? verdict(id).cls : "none";

// 状態
const st = { q: "", maker: "", form: "", sort: "value", bank: 0, sel: null };
try { st.sort = localStorage.getItem("ear-sort") || "value"; } catch (e) {}
function list() {
  const terms = st.q.split(/[\s　]+/).map(norm).filter(Boolean);
  const l = ids.filter((id) => (!st.maker || byId[id].maker === st.maker) && (!st.form || groupOf(byId[id]) === st.form) && terms.every((t) => KW[id].includes(t)));
  const r = (id) => verdict(id).r ?? 9;
  if (st.sort === "fair") return l.sort((x, y) => fair(y) - fair(x));
  if (st.sort === "low") return l.sort((x, y) => (actualPrice(x) || 1e9) - (actualPrice(y) || 1e9));
  // 割安な順は、いま Amazon で買えるもの（今の値段が取れたもの）を先に
  return l.sort((x, y) => (!livePrice(x) - !livePrice(y)) || r(x) - r(y));
}

// ---- 画面 ----
// 飾りの波形（機種ごとに決まった形）。緑の帯＝0〜妥当な価格、赤い線＝いまの値段
function waveSVG(id) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1664525 + 1013904223) >>> 0) / 4294967296);
  let d = "";
  for (let i = 0; i < 96; i++) { const a = 0.18 + 0.82 * Math.abs(Math.sin(i / 7 + rnd() * 1.4)) * (0.45 + rnd() * 0.55); d += `M${i + 0.5} ${17 - a * 14}V${17 + a * 14}`; }
  return `<svg viewBox="0 0 96 34" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" stroke="#34353b" stroke-width=".5"/></svg>`;
}
function waveHTML(id, withTicks) {
  const f = fair(id), a = actualPrice(id), sc = scaleFor(Math.max(f, a || 0));
  const ticks = []; if (withTicks) for (let x = 0; x <= sc.R; x += sc.step) ticks.push(`<span style="left:${pct(x, sc.R)}%">${x ? yen(x) : "¥0"}</span>`);
  return `<div class="wave">${waveSVG(id)}<div class="reg" style="width:${pct(f, sc.R)}%"></div>${a ? `<div class="head" style="left:${pct(a, sc.R)}%"></div>` : ""}</div>` +
    (withTicks ? `<div class="ticks">${ticks.join("")}</div>` : "");
}
function priceNow(id) {
  const p = livePrice(id), a = actualPrice(id);
  return p ? { v: p.amount, at: `Amazon ${liveAt()}` } : a ? { v: a, at: `${snapAt()} 時点` } : null;
}
function shotHTML(id) {
  const m = byId[id], img = imgOf(id), q = LIVE_OK ? P(id) : {};
  return `<div class="shot">${img ? `<img src="${esc(img)}" alt="${esc(m.name)}">` : `<span class="ph">${esc(m.maker || "")}</span>`}` +
    (q.gone || !AMAZON[m.id] ? `<span class="tag">商品ページなし</span>` : q.out ? `<span class="tag">在庫切れ</span>` : "") + `</div>`;
}
function bigHTML(id) {

}

// Q-Link つまみ：段ごとの「満たした割合」をつまみの向きと光の輪で
function knobsHTML(id, big) {
  return TIERS.map((t) => {
    const c = Math.min(1, tierCredit(id, t)), a0 = -135, a1 = a0 + 270 * c, r = 24;
    const pt = (a) => [29 + r * Math.sin(a * Math.PI / 180), 29 - r * Math.cos(a * Math.PI / 180)];
    const arc = (from, to) => { const [x0, y0] = pt(from), [x1, y1] = pt(to); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
    const [px, py] = [29 + 12 * Math.sin(a1 * Math.PI / 180), 29 - 12 * Math.cos(a1 * Math.PI / 180)];
    return `<div class="knob"><svg viewBox="0 0 58 58" aria-hidden="true">
        <path d="${arc(a0, 135)}" fill="none" stroke="#2a2a2f" stroke-width="2.4" stroke-linecap="round"/>
        ${c > 0.005 ? `<path d="${arc(a0, a1)}" fill="none" stroke="${TIER_C[t.id]}" stroke-width="2.4" stroke-linecap="round"/>` : ""}
        <circle cx="29" cy="29" r="16.5" fill="#202024" stroke="rgba(255,255,255,.12)"/>
        <line x1="${(29 + 5 * Math.sin(a1 * Math.PI / 180)).toFixed(2)}" y1="${(29 - 5 * Math.cos(a1 * Math.PI / 180)).toFixed(2)}" x2="${px.toFixed(2)}" y2="${py.toFixed(2)}" stroke="#f4f4f2" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="k-l">${big ? t.name : TIER_SHORT[t.id]}</span><span class="k-v">+¥${yen(Math.round(tierGain(id, t) / 100) * 100)}${big ? ` / ¥${yen(tierMax(t))}` : ""}</span></div>`;
  }).join("");
}

      <p>本ページはプロモーション（Amazonアソシエイト）を含みます。</p>
      ${LIVE_OK ? `<p>価格および発送可能時期は表示された日付・時刻（${liveAt()}）の時点のものであり、変更される場合があります。本商品の購入においては、購入の時点でAmazon.co.jpに表示されている価格および発送可能時期の情報が適用されます。</p>` : ""}
      <p>いまの値段は Amazon の値段（毎朝更新）です。在庫切れ・商品ページがないものは、採点したとき（${SNAPSHOT.at}）の実売です。割引率は Amazon の商品ページに表示された参考価格・過去価格との比較で、セールの値段はプライム会員向けの場合があります。</p>
      <p>機種データは ${esc(DATA.generated)} 時点の公開情報（ノイキャンの dB は 2026-10-03 調査）、採点は ${SNAPSHOT.at} 時点です。</p>
      <p>Amazonのアソシエイトとして、4.5roomは適格販売により収入を得ています。</p>
    </section>`;
  const q = document.getElementById("q"), qc = document.getElementById("qc");
  q.oninput = () => { st.q = q.value; st.bank = 0; qc.hidden = !q.value; renderPads(); };
  qc.onclick = () => { q.value = ""; q.oninput(); q.focus(); };
  q.closest(".field").onsubmit = (e) => e.preventDefault();
  q.onkeydown = (e) => { if (e.key === "Enter") q.blur(); };
  document.getElementById("maker").onchange = (e) => { st.maker = e.target.value; st.bank = 0; renderPads(); };
  document.getElementById("form").onchange = (e) => { st.form = e.target.value; st.bank = 0; renderPads(); };
  document.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { st.sort = b.dataset.sort; st.bank = 0; st.sel = null; try { localStorage.setItem("ear-sort", st.sort); } catch (e) {} renderPads(); });
  document.querySelectorAll("[data-bank]").forEach((b) => b.onclick = () => { st.bank = +b.dataset.bank; st.sel = list()[st.bank * 16] || st.sel; renderPads(); });
  renderPads();
}

// 物差しのしくみ（取扱説明書）
function segHTML(v, n, tc) { let s = ""; for (let i = 0; i < n; i++) s += `<i class="${i < Math.round(v * n) ? "on" : ""}"></i>`; return `<span class="seg" style="--tc:${tc}">${s}</span>`; }
function manualHTML() {
  const w = weights(), wmax = Math.max(1, ...Object.values(w));
  return `<section class="manual"><span class="silk">manual</span><h2>物差しのしくみ</h2>
    <p>採点は値段を考えずに、モノとしての出来で付けています（絶対評価）。値段との釣り合いは、妥当な価格といまの値段で見ます。</p>
    <p class="formula">妥当な価格 ＝ ${S.base ? `基準額 ¥${yen(S.base)} ＋ ` : ""}項目の金額 × 満たした割合 の合計</p>
    ${TIERS.map((t) => `<div class="tier"><div class="tier-h"><i style="background:${TIER_C[t.id]}"></i><b>${t.name}</b><span>〜¥${yen(t.line)} の線</span><span class="v">計 ¥${yen(tierMax(t))}</span></div>
      ${t.keys.map((k) => `<div class="w-row"><span>${ITEMS[k].label}</span>${segHTML((w[k] || 0) / wmax, 12, TIER_C[t.id])}<span class="y">¥${yen(Math.round(w[k] || 0))}</span></div>`).join("")}</div>`).join("")}
    <p style="margin-top:20px">割合は「普通」で半分、「最高」で満額、「感動」は満額の1.25倍。機能が「なし」は0、「不明」と未評価は「普通」と同じ。電池は6時間で0・8時間で満額、ノイキャンは公称 ${DB_ZERO}dB で0・${DB_FULL}dB で満額（dB 非公表の機種は体感の採点）。</p>
    <p>線の位置（5,000／7,000／10,000／15,000円）は、これまでの動画で話してきた値段の感覚から。項目ごとの金額は、機種ごとに付けた「この値段は安い／妥当／高い」に合うように、偏りすぎない範囲で決めています。</p>
  </section>`;
}

// ===== 機種の詳しい画面（TRACK VIEW）=====
function specChips(m) {
  const b = m.battery_h || {};
  return [m.form, wtTxt(m), m.anc === true ? (ancDb(m.id) ? `ANC ${ancDb(m.id)}dB` : "ANC") : m.anc === false ? "ANCなし" : null,
    b.anc_off || b.anc_on ? `電池 ${[b.anc_on && `ANCオン${b.anc_on}h`, b.anc_off && `${b.anc_on ? "オフ" : ""}${b.anc_off}h`].filter(Boolean).join("／")}` : null,
    (m.codecs || []).length ? m.codecs.join("・") : null, m.release ? `発売 ${String(m.release).slice(0, 7)}` : null,
  ].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("");
}
function peers(id, k, x) {
  if (x == null || x === "unknown") return [];
  return ids.filter((o) => o !== id && S.ratings[o] && S.ratings[o].v && S.ratings[o].v[k] === x).slice(0, 2);
}
function itemHTML(id, k) {
  const m = byId[id], it = ITEMS[k], x = val(id, k), tc = TIER_C[tierOf[k].id];
  let right = "", peer = "";
  if (k === "anc" && x !== "none" && ancDb(id) != null) {
    const src = m.anc_src || {};
    right = `<span class="lvl">${segHTML(Math.min(1, credit(id, k)), 10, tc)}<em>${ancDb(id)}dB</em></span>`;
    peer = `公称「${esc(src.quote || ancDb(id) + "dB")}」${src.src ? ` ・ <a href="${esc(src.src)}" target="_blank" rel="noopener">出典</a>` : ""}`;
  } else if (it.type === "hours") {
    const h = parseFloat(x);
    right = isNaN(h) ? `<span class="led">不明</span>` : `<span class="lvl">${segHTML(credit(id, k), 10, tc)}<em>${h}h</em></span>`;
  } else if (it.type === "bool") {
    right = `<span class="led${x === 1 ? " on" : ""}"><i></i>${x === 1 ? "あり" : x === 0 ? "なし" : "不明"}</span>`;
  } else {
    const sel = typeof x === "number" ? x : null, idx = sel == null ? -1 : RATE.findIndex(([o]) => o === sel);
    right = `<span class="lvl" role="img" aria-label="${esc(it.label)}：${esc(RATE_WORD[x] || "未評価")}">${segHTML((idx + 1) / RATE.length, RATE.length, tc)}<em class="${sel == null ? "no" : ""}">${esc(RATE_WORD[x] || "未評価")}</em></span>`;
    const pe = peers(id, k, x);
    if (sel != null && pe.length) peer = `同じ「${RATE_WORD[x]}」：${pe.map((o) => `<a href="#${o}" data-open="${o}">${esc(byId[o].name)}</a>`).join("・")}`;
  }
  return `<div class="it" style="--tc:${tc}"><span class="lb">${esc(it.label)}</span>${right}${peer ? `<span class="peer">${peer}</span>` : ""}</div>`;
}
function detailHTML(id) {
  const m = byId[id], f = fair(id), now = priceNow(id), p = livePrice(id), v = verdict(id);
  return `<div class="in">
    <div class="bk"><button type="button" class="hk" id="close">← 戻る</button><span class="silk">track view</span></div>
    <div class="d-top">${shotHTML(id)}<div><span class="s-maker">${esc(m.maker || "")}</span><h2>${esc(m.name)}</h2><div class="specs">${specChips(m)}</div></div></div>
    <div class="d-box"><div class="bezel"><div class="screen" style="--glow:${GLOW[vcls(id)]}">
      <div class="sbar"><span>私の基準での妥当な価格</span><span>${now ? esc(now.at) : ""}</span></div>
      <div class="d-fair"><b>¥${yen(f)}</b>${bigHTML(id).replace('class="s-big"', 'class="s-big" style="margin:0"')}</div>
      ${waveHTML(id, true)}
      <div class="wlab"><span class="now">いま${now ? `<b>¥${yen(now.v)}</b>` : " 不明"}</span><span>私の妥当<b>¥${yen(f)}</b></span></div>
    </div></div></div>
    <a class="d-amz" href="${esc(amazonUrl(m))}" target="_blank" rel="sponsored noopener">${AMAZON[m.id] ? "Amazonで見る" : "Amazonで探す"}${p ? `<b>¥${yen(p.amount)}</b>${p.pct ? `<span>−${p.pct}%</span>` : ""}` : ""}</a>
    ${p ? `<p class="d-disc">価格および発送可能時期は表示された日付・時刻（${liveAt()}）の時点のものであり、変更される場合があります。本商品の購入においては、購入の時点でAmazon.co.jpに表示されている価格および発送可能時期の情報が適用されます。${p.badge ? `「${esc(p.badge)}」の値段はプライム会員向けの場合があります。` : ""}</p>` : ""}
    <p class="d-disc" style="margin-top:4px">Amazonのアソシエイトとして、4.5roomは適格販売により収入を得ています。</p>
    <div class="d-q"><div class="qlink">${knobsHTML(id, true)}</div></div>
    <p class="d-disc" style="margin-top:14px">採点は値段を考えずに、モノとしての出来で付けています（絶対評価）。</p>
    ${TIERS.map((t) => `<div class="d-tier"><div class="tier-h"><i style="background:${TIER_C[t.id]}"></i><b>${t.name}</b><span>〜¥${yen(t.line)} の線</span>
      <span class="v">+¥${yen(Math.round(tierGain(id, t) / 100) * 100)} / ¥${yen(tierMax(t))}</span></div>${t.keys.map((k) => itemHTML(id, k)).join("")}</div>`).join("")}
    ${(m.sources || []).length ? `<div class="srcs"><span>公開情報の出典</span>${m.sources.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, "").slice(0, 60))}</a>`).join("")}</div>` : ""}
    ${m.price_note && !p ? `<p class="d-disc">実売のメモ：${esc(m.price_note)}</p>` : ""}
  </div>`;
}
let sheetId = null;
function showSheet(id) {
  sheetId = id && byId[id] && ids.includes(id) ? id : null;
  if (!sheetId) { $sheet.hidden = true; document.documentElement.style.overflow = ""; return; }
  $sheet.innerHTML = detailHTML(sheetId);
  $sheet.hidden = false; $sheet.scrollTop = 0;
  document.documentElement.style.overflow = "hidden";
  document.getElementById("close").onclick = closeSheet;
  $sheet.querySelectorAll("[data-open]").forEach((x) => x.onclick = (e) => { e.preventDefault(); openSheet(x.dataset.open, true); });
  $sheet.focus({ preventScroll: true });
}
// 機種ごとに URL の # を変える（戻るボタンで本体に戻れる・共有できる）
function openSheet(id, replace) {
  if (replace) history.replaceState({ m: id }, "", "#" + id); else history.pushState({ m: id }, "", "#" + id);
  showSheet(id);
}
function closeSheet() {
  if (history.state && history.state.m) history.back();
  else { history.replaceState(null, "", location.pathname + location.search); showSheet(null); }
  if (sheetId == null && st.sel) select(st.sel);
}
window.addEventListener("popstate", () => showSheet(decodeURIComponent(location.hash.slice(1))));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetId) closeSheet(); });

let drawn = false;
function render() {
  if (!drawn) { renderList(); drawn = true; }
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && ids.includes(h)) { st.sel = h; renderPads(); }
  showSheet(h);
}
let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000);
}

if (PUBLIC) {
  document.body.classList.add("ro");
  document.getElementById("sync-t").textContent = "採点 " + SNAPSHOT.at + " 時点";
}
render();

// 中身が同じか（キーの順番は問わない）
function same(a, b) {
  const norm = (x) => x && typeof x === "object"
    ? (Array.isArray(x) ? x.map(norm) : Object.fromEntries(Object.keys(x).sort().map((k) => [k, norm(x[k])])))
    : x;
  return JSON.stringify(norm(a)) === JSON.stringify(norm(b));
}

// ===== 保存先：db が使えれば、端末をまたいで残る =====
(async () => {
  if (PUBLIC || !window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db) return;
  S.db = db;
  if (user) {
    const w = await user.can("data.write");
    if (w === false) S.canWrite = false;
  }
  const sync = document.getElementById("sync");
  document.getElementById("sync-t").textContent = S.canWrite ? "クラウドに保存" : "閲覧のみ";
  sync.classList.add("on");
  let first = true;
  db.collection("ratings").onSnapshot((snap) => {
    const remote = {};
    let changed = false;
    snap.docs.forEach((d) => { if (d.exists) remote[d.id] = d.data(); });
    // 初回：db が空でこの端末に採点があれば、それを db へ上げる
    if (first && snap.empty && S.canWrite) {
      Object.keys(S.ratings).forEach((id) => persist(id));
    } else {
      Object.entries(remote).forEach(([id, body]) => {
        const mine = S.ratings[id];
        if ((!mine || !mine.at || (body.at && body.at >= mine.at)) && !same(mine, body)) {
          S.ratings[id] = JSON.parse(JSON.stringify(body));
          changed = true;
        }
      });
    }
    first = false;
    saveLocal();
    // 入力中の欄を壊さないよう、詳細では入力欄にフォーカスがなければ描き直す
    if (changed && !(document.activeElement && document.activeElement.tagName === "INPUT")) render();
  }, () => {});
  db.doc("settings/ruler").onSnapshot((d) => {
    if (d.exists && d.data()) {
      const b = d.data(), before = { inc: S.inc, w: S.w, base: S.base };
      S.inc = { ...S.inc, ...b.inc };
      S.w = b.w || null;
      if (b.base != null) S.base = b.base;
      if (S.view.name !== "ruler" && !same(before, { inc: S.inc, w: S.w, base: S.base })) render();
    }
  }, () => {});
})();
