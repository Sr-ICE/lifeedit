<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">
<meta property="og:title" content="4.5roomのイヤホンの物差し">
<meta property="og:description" content="4.5roomが使ってきたイヤホンを項目ごとに採点し、自分の基準での妥当な価格と実売を比べた一覧です。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://4-5room.com/earphones/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>4.5roomのイヤホンの物差し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* 値段の窓（黒い面）に妥当な価格と目盛りを集め、内訳は4つの段の色で示す。
     色は段の見分けにだけ使い、ほかは白黒。面は平らに、数字は細く大きく */
  :root {
    color-scheme: light;
    --body: #f4f4f1;
    --face: #ffffff;
    --well: #e9e9e5;
    --ink: #121213;
    --sub: #6d6d72;
    --line: rgba(18, 18, 19, .1);
    --screen: #121213;
    --screen-ink: #f4f4f1;
    --screen-sub: #8e8e93;
    --screen-line: rgba(244, 244, 241, .12);
    --c-base: #a3a39e;
    --c-look: #d8a23a;
    --c-sound: #df6a3e;
    --c-func: #4b7bd1;
    --c-daily: #3a9c78;
    --warn: #c2410c;
    --num: -apple-system, "SF Pro Display", "Helvetica Neue", "Manrope", sans-serif;
    --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Zen Kaku Gothic New", system-ui, sans-serif;
    --bar-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --body: #0b0b0c; --face: #18181a; --well: #242427; --ink: #f2f2ef; --sub: #8e8e93; --line: rgba(242, 242, 239, .1);
      --screen: #18181a; --screen-ink: #f2f2ef; --screen-sub: #8e8e93; --screen-line: rgba(242, 242, 239, .1);
      --c-base: #6b6b70; --c-look: #e3b04e; --c-sound: #ec7a4e; --c-func: #6a95e6; --c-daily: #4fb38d; --warn: #ff9f0a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --body: #0b0b0c; --face: #18181a; --well: #242427; --ink: #f2f2ef; --sub: #8e8e93; --line: rgba(242, 242, 239, .1);
    --screen: #18181a; --screen-ink: #f2f2ef; --screen-sub: #8e8e93; --screen-line: rgba(242, 242, 239, .1);
    --c-base: #6b6b70; --c-look: #e3b04e; --c-sound: #ec7a4e; --c-func: #6a95e6; --c-daily: #4fb38d; --warn: #ff9f0a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  i { font-style: normal; }
  [hidden] { display: none !important; }
  body {
    background: var(--body); color: var(--ink);
    font-family: var(--jp); font-size: 15px; line-height: 1.6;
    padding-inline: 16px;
    padding-block: 0 calc(var(--bar-h) + 30px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 600px; margin-inline: auto; }
  .num, .mono { font-family: var(--num); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--c-func); outline-offset: 2px; }
  a { color: inherit; text-decoration-color: var(--sub); text-underline-offset: 3px; }

  /* ボタン：平らな面＋細い線。選ぶと黒で塗る */
  .key {
    background: var(--face); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .key:active { background: var(--well); }
  .key:disabled { opacity: .4; cursor: default; }
  .key.latched, .key[aria-pressed="true"].latch { background: var(--ink); border-color: var(--ink); color: var(--body); }

  /* 上部 */
  .appbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    margin-inline: -16px; padding: 14px 16px 12px;
    background: color-mix(in srgb, var(--body) 88%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .appbar h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .appbar .sync { font-size: 11px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .led { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--well); flex: none; }
  .sync.on .led { background: var(--c-daily); }
  .app-price { flex: none; font-family: var(--num); font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }

  /* 一覧 */
  .hero { margin-block: 6px 14px; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stats b { display: block; font-family: var(--num); font-weight: 200; font-size: 46px; line-height: 1.02; letter-spacing: -.04em; color: var(--screen-ink); font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--screen-sub); }
  .best { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding-top: 12px; border: 0; border-top: 1px solid var(--screen-line); background: none; font-size: 12px; color: var(--screen-sub); cursor: pointer; text-align: left; }
  .best b { color: var(--screen-ink); font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .best .num { grid-column: 2; color: var(--c-daily); font-size: 12.5px; }
  .seg-keys { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
  .seg-keys .key { min-height: 40px; font-size: 12.5px; padding: 0 6px; }
  .seg-keys .key .num { font-size: 11px; opacity: .6; margin-left: 5px; }
  .scale-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); margin: 22px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--sub); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .rows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .row {
    width: 100%; text-align: left; cursor: pointer; background: var(--face); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px 15px; display: grid; gap: 6px;
  }
  .row:active { background: var(--well); }
  .row .r1, .row .r2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row .nm { font-weight: 600; font-size: 15px; line-height: 1.4; min-width: 0; }
  .row .pr { font-family: var(--num); font-size: 21px; font-weight: 300; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .meta { font-size: 12px; color: var(--sub); min-width: 0; }
  .row .meta .todo { color: var(--warn); }
  .row .rk { font-family: var(--num); font-weight: 300; font-size: 18px; color: var(--sub); margin-right: 10px; }
  .row .rule { margin-top: 4px; }
  .vd { font-size: 12px; white-space: nowrap; font-weight: 600; }
  .vd.cheap { color: var(--c-daily); }
  .vd.cheap::before { content: "▼ "; font-size: .8em; }
  .vd.pricey { color: var(--warn); }
  .vd.pricey::before { content: "▲ "; font-size: .8em; }
  .vd.none { color: var(--sub); font-weight: 400; }

  /* 物差し（目盛りと内訳の帯） */
  .rule { position: relative; }
  .track { position: relative; display: flex; height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; }
  .sg { display: block; height: 100%; flex: none; }
  .sg + .sg { box-shadow: inset 2px 0 0 var(--face); }
  .sg-base { background: var(--c-base); }
  .sg-look { background: var(--c-look); }
  .sg-sound { background: var(--c-sound); }
  .sg-func { background: var(--c-func); }
  .sg-daily { background: var(--c-daily); }
  .anim .sg, .anim .act, .anim .mk { transition: width .5s cubic-bezier(.16, 1, .3, 1), left .5s cubic-bezier(.16, 1, .3, 1); }
  .act { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .ticks { position: relative; height: 22px; margin-top: 6px; }
  .tk { position: absolute; top: 0; width: 1px; height: 4px; background: var(--sub); opacity: .5; }
  .tk.mj { height: 8px; opacity: 1; }
  .tk span { position: absolute; top: 11px; left: 0; transform: translateX(-50%); font-family: var(--num); font-size: 10px; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tk:last-child span { transform: translateX(-100%); }
  .tk:first-child span { transform: none; }
  .row .track { height: 5px; }

  /* 詳細 */
  .back { background: none; border: 0; color: var(--sub); padding: 4px 0; cursor: pointer; font-size: 13px; }
  .d-head { display: grid; gap: 8px; padding-block: 6px 16px; }
  .d-head h2 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
  .specs { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11.5px; color: var(--sub); }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; background: none; border: 0; padding: 4px 0; justify-self: start; }
  .switch .sw { width: 40px; height: 24px; border-radius: 12px; background: var(--well); position: relative; transition: background .15s; }
  .switch .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--face); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
  .switch[aria-checked="true"] .sw { background: var(--c-daily); }
  .switch[aria-checked="true"] .sw::after { transform: translateX(16px); }

  /* 値段の窓 */
  .screen { background: var(--screen); color: var(--screen-ink); border-radius: 22px; padding: 18px 18px 16px; display: grid; gap: 2px; }
  .screen .lab { font-size: 12px; color: var(--screen-sub); }
  .screen .big { font-family: var(--num); font-weight: 200; font-size: clamp(60px, 19vw, 84px); line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .screen .big small { font-size: .38em; font-weight: 300; color: var(--screen-sub); margin-right: .1em; letter-spacing: 0; }
  .screen .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; font-size: 13px; color: var(--screen-sub); }
  .screen .foot .vd { font-size: 13px; }
  .screen .foot .vd.cheap { color: var(--c-daily); }
  .screen .d-rule { margin-top: 16px; }
  .screen .track { background: var(--screen-line); height: 14px; border-radius: 4px; }
  .screen .sg + .sg { box-shadow: inset 2px 0 0 var(--screen); }
  .screen .tk { background: var(--screen-sub); }
  .screen .tk span { color: var(--screen-sub); }
  .screen .act { background: var(--screen-ink); top: -6px; bottom: -6px; width: 2.5px; margin-left: -1.25px; }
  .screen .labels { position: relative; height: 18px; margin-bottom: 5px; font-size: 11px; color: var(--screen-ink); }
  .screen .act-note { font-size: 10.5px; color: var(--screen-sub); margin-top: 2px; }
  .mk { position: absolute; bottom: 0; white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  .mk.right { transform: translateX(-100%); }
  .mk.left { transform: none; }

  .amz { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; margin-top: 10px; border-radius: 14px;
    background: var(--ink); color: var(--body); font-size: 14px; font-weight: 700; text-decoration: none; }
  .amz:active { opacity: .8; }
  .disc { margin: 6px 0 0; font-size: 11px; }
  .tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .tier-key { text-align: left; padding: 11px 12px; display: grid; gap: 3px; min-height: 56px; border-radius: 14px; }
  .tier-key .t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .tier-key .t i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .tier-key .v { font-family: var(--num); font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }

  .field { display: grid; gap: 8px; margin-top: 24px; }
  .field > .lab { font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; gap: 10px; }
  .lcd {
    background: var(--face); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    font-family: var(--num); font-size: 19px; font-weight: 300; padding: 8px 12px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .lcd:focus { border-color: var(--ink); outline: none; }
  .lcd::placeholder { color: var(--sub); }
  .actual-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; }
  .actual-row .lcd { width: 8.5em; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.65; }
  .judge { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  .judge .key { min-height: 44px; font-size: 11.5px; padding: 0 2px; line-height: 1.25; }

  .todo-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 26px; min-height: 52px; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--well); font-size: 13px; }
  .todo-bar b { font-family: var(--num); color: var(--warn); font-weight: 600; }
  .todo-bar .key { padding: 8px 12px; font-size: 12.5px; }
  .todo-bar.done-all { color: var(--sub); }

  .group { margin-top: 32px; scroll-margin-top: 64px; }
  .group-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 9px; padding-bottom: 6px; }
  .group-h i { width: 12px; height: 12px; border-radius: 4px; }
  .group-h b { font-size: 15px; }
  .group-h b small { font-family: var(--num); font-weight: 400; font-size: 12px; color: var(--sub); margin-left: 6px; }
  .group-h .v { font-family: var(--num); font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .group > .item { background: var(--face); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
  .item { display: grid; gap: 9px; }
  .item .lab { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-height: 28px; }
  .item .lab .name { flex: 1 1 auto; min-width: 0; }
  .item .lab small { font-weight: 400; color: var(--sub); font-size: 11px; }
  .item.todo { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .item.todo .lab .name::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 7px; vertical-align: 1px; }
  .chips { display: flex; gap: 5px; flex: none; }
  .chips .key { font-size: 11px; padding: 4px 11px; border-radius: 999px; min-height: 28px; }

  /* 採点キー：選んだ段までランプが段の色で灯る */
  .meter { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
  .meter .key { min-height: 50px; padding: 8px 2px 7px; display: grid; justify-items: center; align-content: space-between; gap: 6px; font-size: 11.5px; color: var(--sub); background: var(--body); border-color: transparent; border-radius: 10px; }
  .meter .key .led { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
  .meter .key.on .led { background: var(--tc); }
  .meter .key[aria-pressed="true"] { color: var(--ink); font-weight: 700; background: color-mix(in srgb, var(--tc) 16%, var(--face)); border-color: var(--tc); }
  .meter .key[aria-pressed="true"] .led { width: 24px; }
  .item.just .meter .key.on .led { animation: lit .35s ease-out; }
  @keyframes lit { from { transform: scaleX(.2); opacity: .3; } 60% { transform: scaleX(1.15); opacity: 1; } to { transform: scaleX(1); } }
  .bool { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  .bool .key { min-height: 42px; font-size: 12.5px; background: var(--body); border-color: transparent; border-radius: 10px; }
  .bool .key[aria-pressed="true"] { background: var(--ink); color: var(--body); }

  .stepper { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px; gap: 6px; align-items: stretch; }
  .stepper .key { font-family: var(--num); font-size: 20px; font-weight: 300; min-height: 46px; background: var(--body); border-color: transparent; }
  .stepper .lcd { width: 100%; text-align: center; font-size: 24px; font-weight: 200; background: var(--body); border-color: transparent; }
  .stepper .unit { position: relative; }
  .stepper .unit::after { content: attr(data-unit); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--sub); pointer-events: none; }
  .mini { position: relative; margin-top: 2px; }
  .mini .track { height: 4px; }
  .mini .zone { position: absolute; top: 0; height: 100%; background: var(--tc, var(--c-base)); }
  .mini .mk { position: absolute; top: -4px; bottom: auto; width: 2px; height: 12px; margin-left: -1px; background: var(--ink); transform: none; }
  .mini .ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--sub); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .linkish { background: none; border: 0; padding: 2px 0; color: var(--sub); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }

  .peer { font-size: 11.5px; color: var(--sub); line-height: 1.5; min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peer b { color: var(--ink); font-weight: 600; }
  .past { font-size: 12px; color: var(--sub); line-height: 1.55; }
  .past b { color: var(--ink); font-weight: 600; }
  .src { font-size: 11px; color: var(--sub); word-break: break-all; }
  .abs { margin: 14px 0 0; }
  details.box { margin-top: 30px; background: var(--face); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  details.box summary { cursor: pointer; font-size: 13.5px; font-weight: 600; }
  details.box ul { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 12.5px; color: var(--sub); }
  .srcs { font-size: 11px; color: var(--sub); margin-top: 14px; word-break: break-all; display: grid; gap: 4px; }

  /* ランキング */
  .sort { margin-bottom: 6px; }
  .empty { color: var(--sub); font-size: 14px; padding: 28px 0; }

  /* 物差しの設定 */
  .formula { margin-top: 6px; }
  .formula .eq { font-size: 14px; line-height: 1.75; color: var(--screen-ink); }
  .formula .eq b { font-weight: 600; }
  .panel { background: var(--face); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; margin-top: 16px; }
  .panel h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h3 span { font-family: var(--num); font-weight: 400; font-size: 12px; color: var(--sub); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools .key { padding: 10px 16px; font-size: 13px; }
  .tools .key.go { background: var(--ink); border-color: var(--ink); color: var(--body); }
  .w-group { margin-top: 28px; }
  .w-group .group-h { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .w-row { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) 6em; align-items: center; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .w-row .bar { height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; }
  .w-row .bar i { display: block; height: 100%; background: var(--tc); }
  .w-row .lcd { width: 100%; font-size: 15px; padding: 6px 8px; }
  .quotes { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 12px; color: var(--sub); }
  table.fit { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.fit th { text-align: left; font-weight: 400; color: var(--sub); font-size: 11px; padding: 4px 0; }
  table.fit td { padding: 6px 0; border-top: 1px solid var(--line); }
  table.fit td.num, table.fit th:not(:first-child) { text-align: right; }
  table.fit td.up { color: var(--c-daily); }
  table.fit td.down { color: var(--warn); }

  /* 下部 */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;

  const it = ITEMS[k], x = val(id, k);

    h1.textContent = PUBLIC ? "4.5roomのイヤホンの物差し" : "イヤホンの物差し";
    ap.hidden = true; sync.hidden = false;
  }
  if (v.name === "detail") renderDetail(v.id);
  else if (v.name === "rank") renderRank();
  else if (v.name === "ruler") renderRuler();
  else renderList();
  if (S.enter && $view.firstElementChild) $view.firstElementChild.classList.add("enter");

}

function orderedIds() {
  let ms = models;
  if (S.filter === "used") ms = ms.filter((m) => used(m.id));
  if (S.filter === "todo") ms = ms.filter((m) => used(m.id) && rated(m.id) < RATE_KEYS.length);
  return ms.map((m) => m.id);
}

const AMAZON_TAG = "srice-22";
function amazonUrl(m) {
  const asin = AMAZON[m.id];
  if (asin) return `https://www.amazon.co.jp/dp/${asin}?tag=${AMAZON_TAG}`;
  if (m.id === "huawei-freebud-neo") return null; // 日本未発売（2026-10-03 時点）
  return `https://www.amazon.co.jp/s?k=${encodeURIComponent(m.name.replace(/[（(].*?[)）]/g, "").trim())}&tag=${AMAZON_TAG}`;
}
// 目盛り：0 から、値が収まる切りのいい額まで
function scaleFor(v) {
  const top = Math.max(10000, v * 1.1);
  const step = top <= 20000 ? 5000 : 10000;
  return { R: Math.ceil(top / step) * step, step };
}
function ticksHTML(R, step) {
  let out = "";
  for (let x = 0; x <= R + 1; x += step / 5) {
    const mj = Math.abs(x % step) < 1;
    out += `<i class="tk${mj ? " mj" : ""}" style="left:${(x / R * 100).toFixed(3)}%">${mj ? `<span>${x ? yen(x) : "¥0"}</span>` : ""}</i>`;
  }
  return out;
}
// 妥当な価格の内訳：基準額＋4つの段
const parts = (id) => [S.base, ...TIERS.map((t) => tierGain(id, t))];
const PART_KEYS = ["base", ...TIERS.map((t) => t.id)];
function stackHTML(vals, R) {
  return vals.map((v, i) => `<i class="sg sg-${PART_KEYS[i]}" style="width:${(Math.max(0, v) / R * 100).toFixed(3)}%"></i>`).join("");
}
function legendHTML() {

}
function vdHTML(id) {

  return vd.r ? `<span class="vd ${vd.cls}">${vd.word} ${Math.round(vd.r * 100)}%</span>` : `<span class="vd none">実売なし</span>`;
}
// 一覧とランキングの1行。全機種で同じ目盛りに載せる
function rowHTML(id, R, rank) {
  const m = byId[id], a = actualPrice(id), n = rated(id), todo = used(id) && !PUBLIC ? todoKeys(id).length : 0;
  return `<li><button type="button" class="row" data-open="${id}">

    <span class="r2"><span class="meta">${esc(m.form || "")}${a ? ` ・ 実売 <span class="num">¥${yen(a)}</span>` : ""}${used(id) ? ` ・ 採点 <span class="num">${n}/${RATE_KEYS.length}</span>` : ""}${todo ? ` ・ <span class="todo">未入力 ${todo}</span>` : ""}</span>${vdHTML(id)}</span>
    <span class="rule"><span class="track">${stackHTML(parts(id), R)}${a ? `<i class="act" style="left:${Math.min(100, a / R * 100).toFixed(3)}%"></i>` : ""}</span></span>
  </button></li>`;
}
function sharedScale(ids) {
  return scaleFor(ids.reduce((mx, id) => Math.max(mx, fair(id), actualPrice(id) || 0), 0));
}

function renderList() {

  const best = models.map((m) => m.id).filter((id) => used(id) && hasRated(id) && verdict(id).r)

      </div>

    </div>
    ${PUBLIC ? `<p class="note disc">本ページはプロモーション（Amazonアソシエイト）を含みます。機種名を押すと、採点の中身と Amazon へのリンクが出ます。</p>` : ""}
    <div class="seg-keys" role="group" aria-label="絞り込み"${PUBLIC ? " hidden" : ""}>

function specLine(m) {
  const b = m.battery_h || {};
  const bits = [
    m.maker, m.form,
    m.weight_g ? `片耳 ${m.weight_g}g` : null,
    m.anc === true ? (m.anc_db ? `ANC ${m.anc_db}dB` : "ANC") : m.anc === false ? "ANCなし" : null,
    b.anc_off || b.anc_on ? `電池 ${[b.anc_on && `ANCオン${b.anc_on}h`, b.anc_off && `${b.anc_on ? "オフ" : ""}${b.anc_off}h`].filter(Boolean).join("／")}` : null,
    (m.codecs || []).length ? m.codecs.join("・") : null,
    m.release ? `発売 ${String(m.release).slice(0, 7)}` : null,
  ].filter(Boolean);
  return bits.map((x) => `<span>${esc(x)}</span>`).join("");
}

function peers(id, k, x) {
  if (x == null) return [];
  return models.filter((m) => m.id !== id && S.ratings[m.id] && S.ratings[m.id].v && S.ratings[m.id].v[k] === x)
    .sort((a, b) => String(S.ratings[b.id].at || "").localeCompare(String(S.ratings[a.id].at || "")))
    .slice(0, 3).map((m) => m.name);
}
function pastLine(m, k) {
  const p = (m.past || {})[k];
  if (!p || !p.length) return "";
  return p.map((x) => `<div class="past">当時：${x.score != null ? `<b>${RATE_WORD[x.score] || ""}</b> ` : ""}${esc(x.summary || "")}${x.date ? `（${esc(x.date.slice(0, 7).replace("-", "."))}）` : ""}</div>`).join("");
}
// 小さな目盛り（電池の時間・ノイキャンの dB）。満額までの区間を段の色で塗る
function miniHTML(v, lo, hi, z0, z1, unit, tc) {
  const p = (x) => ((Math.min(hi, Math.max(lo, x)) - lo) / (hi - lo) * 100).toFixed(2);
  return `<div class="mini" style="--tc:${tc}"><div class="track"><i class="zone" style="left:${p(z0)}%;width:${p(z1) - p(z0)}%"></i></div>${v != null && !isNaN(v) ? `<i class="mk" style="left:${p(v)}%"></i>` : ""}
    <div class="ends"><span>${lo}${unit}</span><span>${z0}${unit}で0 ・ ${z1}${unit}で満額</span><span>${hi}${unit}</span></div></div>`;
}
function stepperHTML(id, k, v, step, unit, ph) {
  return `<div class="stepper"><button type="button" class="key" data-step="${-step}" data-sk="${k}" aria-label="${step}${unit}減らす">−</button>
    <span class="unit" data-unit="${unit}"><input class="lcd" id="${k}-${id}" data-sk-in="${k}" type="number" inputmode="decimal" step="${step}" min="0" value="${v ?? ""}" placeholder="${ph}"></span>
    <button type="button" class="key" data-step="${step}" data-sk="${k}" aria-label="${step}${unit}増やす">＋</button></div>`;
}

function itemHTML(id, k) {
  const m = byId[id], it = ITEMS[k], x = val(id, k), r = S.ratings[id] || {}, tc = TIER_C[tierOf[k].id];
  const factNote = it.fact && !(r.v && k in r.v && r.v[k] != null) && factDefault(m, k) != null ? "<small>公開情報から</small>" : "";
  const ancNote = k === "anc" && m.anc === false && !(r.v && r.v.anc != null) ? "<small>公開情報でANCなし</small>" : "";
  const just = S.just && S.just.id === id && S.just.k === k ? " just" : "";
  const head = (chips) => `<div class="lab"><span class="name">${it.label}</span>${factNote}${ancNote}${chips || ""}</div>`;
  let body = "";
  if (it.type === "hours") {
    const h = parseFloat(x);
    body = head() + stepperHTML(id, "battery", x, 0.5, "h", "不明") + miniHTML(isNaN(h) ? null : h, 4, 10, 6, 8, "h", tc);
  } else if (it.type === "bool") {
    body = head() + `<div class="bool" role="group" aria-label="${it.label}">${BOOL.map(([o, w]) =>
      `<button type="button" class="key latch" data-k="${k}" data-o="${o}" aria-pressed="${(x ?? null) === o}">${w}</button>`).join("")}</div>`;
  } else {
    // 評価：ノイキャンは dB が分かれば dB で決める（体感の採点は使わない）
    const db = k === "anc" ? ancDb(id) : null, dbMode = k === "anc" && x !== "none" && db != null;
    const extra = [...(it.none ? [["none", "なし"]] : []), ["unknown", "不明"]];
    const chips = `<span class="chips">${extra.map(([o, w]) => `<button type="button" class="key latch" data-k="${k}" data-o="${o}" aria-pressed="${x === o}">${w}</button>`).join("")}</span>`;
    if (dbMode) {
      const own = r.v && r.v.anc_db != null, src = m.anc_src || {};
      body = head(chips) + stepperHTML(id, "anc_db", db, 1, "dB", "")
        + miniHTML(db, 30, 65, DB_ZERO, DB_FULL, "dB", tc)
        + `<div class="src">${own ? "本人が入力した値" : `公称「${esc(src.quote || db + "dB")}」${src.note ? ` ・ ${esc(src.note)}` : ""}${src.src ? ` ・ <a href="${esc(src.src)}" target="_blank" rel="noopener">出典</a>` : ""}`}</div>`
        + (PUBLIC ? "" : own && m.anc_db != null ? `<button type="button" class="linkish" id="db-reset">公称値（${m.anc_db}dB）に戻す</button>` : own ? `<button type="button" class="linkish" id="db-reset">dB を消して体感で付ける</button>` : "")
        + (typeof x === "number" ? `<div class="past">体感の採点「${RATE_WORD[x]}」は、dB があるので使っていません</div>` : "");
    } else {
      const sel = typeof x === "number" ? x : null;
      const pe = peers(id, k, x);
      const peerLine = x != null && x !== "unknown"
        ? `<div class="peer">${pe.length ? `同じ「<b>${RATE_WORD[x]}</b>」：${pe.map(esc).join("・")}` : `「${RATE_WORD[x]}」はこの機種が最初です`}</div>`
        : `<div class="peer" aria-hidden="true"></div>`;
      body = head(chips) + `<div class="meter" role="group" aria-label="${it.label}" style="--tc:${tc}">${RATE.map(([o, w]) =>
        `<button type="button" class="key${sel != null && o <= sel ? " on" : ""}" data-k="${k}" data-o="${o}" aria-pressed="${x === o}"><span class="led"></span>${w}</button>`).join("")}</div>`
        + (k === "anc" && x !== "none" && !PUBLIC ? `<button type="button" class="linkish" id="db-add">公称の dB を入れる（dB が分かれば dB で判定）</button>` : "")
        + peerLine;
    }
  }
  return `<div class="item${filled(id, k) ? "" : " todo"}${just}" id="it-${k}">${body}${pastLine(m, k)}</div>`;
}

function renderDetail(id) {
  const m = byId[id], f = fair(id), a = actualPrice(id), vd = verdict(id), r = S.ratings[id] || {};
  const now = parts(id), sc = scaleFor(Math.max(f, a || 0));
  const prev = S.shown && S.shown.id === id ? S.shown : null;
  S.shown = { id, fair: f, parts: now, actual: a };
  const animate = prev && !calm() && (prev.fair !== f || prev.actual !== a);
  const pct = (v) => (Math.min(100, Math.max(0, v / sc.R * 100))).toFixed(3);
  const fairPos = pct(now.reduce((s, v) => s + Math.max(0, v), 0));

    <div class="screen" aria-live="polite">

      <div class="ticks">${ticksHTML(sc.R, sc.step)}</div>

      <p class="note disc">Amazonのアソシエイトとして、4.5roomは適格販売により収入を得ています。</p>` : ""; })()}
    <div class="tiers">${TIERS.map((t) => `<button type="button" class="key tier-key" data-jump="${t.id}">

    ${PUBLIC ? "" : todoN

    ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
  </section>`;

  // 採点で値が動いたら、針と帯と数字を前の値から動かす

  $view.querySelectorAll("button[data-k]").forEach((b) => b.onclick = () => {

  });
  // 電池と dB：＋−で刻む。数字を直接打ってもいい
  const stepVal = (k, v) => setVal(id, k, v == null || isNaN(v) ? null : Math.round(Math.max(0, v) * 10) / 10);
  $view.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => {
    const k = b.dataset.sk, step = parseFloat(b.dataset.step);
    const cur = k === "battery" ? parseFloat(val(id, "battery")) : ancDb(id);
    stepVal(k, (cur == null || isNaN(cur) ? (k === "battery" ? 6 : 45) - step : cur) + step);
  });
  $view.querySelectorAll("[data-sk-in]").forEach((inp) => inp.onchange = () =>
    stepVal(inp.dataset.skIn, inp.value === "" ? null : parseFloat(inp.value)));
  const dbAdd = document.getElementById("db-add");
  if (dbAdd) dbAdd.onclick = () => setVal(id, "anc_db", 45);
  const dbReset = document.getElementById("db-reset");
  if (dbReset) dbReset.onclick = () => setVal(id, "anc_db", null);
  const ai = document.getElementById("actual-" + id);
  ai.onchange = () => {
    const rr = S.ratings[id] || (S.ratings[id] = { v: {}, actual: null });
    rr.actual = ai.value === "" ? null : parseFloat(ai.value);
    rr.at = new Date().toISOString();
    persist(id); render();
  };
}

function solve(A, b) {
  const n = b.length, M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-9;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c] / d;
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => row[n] / (row[i] || 1e-9));
}
function judgedRows() {
  const keys = Object.keys(ITEMS);
  // 項目を1つも採点していない機種は、全部「普通」扱いになり結果を濁すので除く
  return models.filter((m) => used(m.id) && hasRated(m.id) && S.ratings[m.id] && JUDGE_F[S.ratings[m.id].judge] && actualPrice(m.id))
    .map((m) => ({ id: m.id, x: [1, ...keys.map((k) => credit(m.id, k))], y: actualPrice(m.id) * JUDGE_F[S.ratings[m.id].judge] }));
}
function fitWeights() {
  const keys = Object.keys(ITEMS), rows = judgedRows();
  if (rows.length < 3) return null;
  const w0 = [S.base, ...keys.map((k) => weights()[k] || 0)];
  const P = w0.length, lam = 1.5; // 今の割り振りを、判断1〜2件ぶんの重さで残す
  const free = new Array(P).fill(true);
  let w = w0.slice();
  for (let it = 0; it < P; it++) {
    const idx = [...Array(P).keys()].filter((j) => free[j]);
    const A = idx.map(() => new Array(idx.length).fill(0)), b = new Array(idx.length).fill(0);
    idx.forEach((j, a) => { A[a][a] += lam; b[a] += lam * w0[j]; });
    rows.forEach((r) => idx.forEach((j, a) => {
      b[a] += r.x[j] * r.y;
      idx.forEach((l, c) => { A[a][c] += r.x[j] * r.x[l]; });
    }));
    const sol = solve(A, b);
    w = new Array(P).fill(0);
    idx.forEach((j, a) => { w[j] = sol[a]; });
    const neg = idx.filter((j) => w[j] < 0);
    if (!neg.length) break;
    neg.forEach((j) => { free[j] = false; });
  }
  const base = Math.round(w[0] / 100) * 100;
  const nw = Object.fromEntries(keys.map((k, i) => [k, Math.round(w[i + 1] / 100) * 100]));
  const err = (bs, ww) => rows.reduce((s, r) => s + Math.abs(rawFair(r.id, bs, ww) - r.y) / r.y, 0) / rows.length;
  return { n: rows.length, base, w: nw, before: err(S.base, weights()), after: err(base, nw),
    rows: rows.map((r) => ({ id: r.id, target: r.y, before: fair(r.id), after: Math.round(rawFair(r.id, base, nw) / 100) * 100 })) };
}

function renderRuler() {
  const w = weights(), wmax = Math.max(1, ...Object.values(w));
  $view.innerHTML = `<section class="view">
    <div class="screen formula">
      <span class="lab">妥当な価格の出し方</span>
      <div class="eq"><b>妥当な価格</b> ＝ 基準額 ¥${yen(S.base)}<br>＋ Σ 項目の金額 × 満たした割合</div>
    </div>
    <p class="note">割合は「普通」で半分、「最高」で満額、「感動」は満額の1.25倍。機能が「なし」は0、「不明」と未評価は「普通」と同じ。電池は6時間で0・8時間で満額、ノイキャンは公称 ${DB_ZERO}dB で0・${DB_FULL}dB で満額（dB 非公表の機種は体感の採点）。</p>
    ${PUBLIC ? "" : fitBlock()}
    ${TIERS.map((t) => `<div class="w-group">
      <div class="group-h"><i style="background:${TIER_C[t.id]}"></i><b>${t.name}<small>〜¥${yen(t.line)} の線</small></b><span class="v">計 ¥${yen(tierMax(t))}</span></div>
      ${t.keys.map((k) => `<label class="w-row" for="w-${k}" style="--tc:${TIER_C[t.id]}"><span>${ITEMS[k].label}</span>
        <span class="bar"><i style="width:${((w[k] || 0) / wmax * 100).toFixed(1)}%"></i></span>
        <input class="lcd" id="w-${k}" data-w="${k}" type="number" inputmode="numeric" step="100" min="0" value="${Math.round(w[k] || 0)}"${PUBLIC ? " readonly" : ""}></label>`).join("")}
      <ul class="quotes"${t.src.length ? "" : " hidden"}>${t.src.map(([who, q, v]) => `<li>${who}「${q}」 <a href="https://youtu.be/${v}" target="_blank" rel="noopener">動画</a></li>`).join("")}</ul>
    </div>`).join("")}
    <p class="note" style="margin-top:22px">${PUBLIC ? `線の位置（5,000／7,000／10,000／15,000円）は、これまでの動画で話してきた値段の感覚から。項目ごとの金額は、機種ごとに付けた「この値段は安い／妥当／高い」に合うように逆算しています。機種データ：${esc(DATA.generated)} 時点の公開情報（ノイキャンの dB は 2026-10-03 調査）。` : `線の位置（5,000／7,000／10,000／15,000円）は過去動画の発言から。項目ごとの金額は、最初は線の上げ幅を等分した仮置きです。値段の判断がたまったら「割り振りを計算」で本人の基準に寄せられます。1.5万円を超える基準は過去の動画にありません。機種データ：${esc(DATA.generated)} 時点の公開情報（ノイキャンの dB は 2026-10-03 調査）。`}</p>
  </section>`;
  $view.querySelectorAll("[data-w]").forEach((inp) => inp.onchange = () => {
    S.w = { ...weights(), [inp.dataset.w]: Math.max(0, parseFloat(inp.value) || 0) };
    S.fit = null; persistInc(); render();
  });
  const calc = document.getElementById("fit-calc");
  if (calc) calc.onclick = () => { S.fit = fitWeights(); render(); };
  const apply = document.getElementById("fit-apply");
  if (apply) apply.onclick = () => { S.w = S.fit.w; S.base = S.fit.base; S.fit = null; persistInc(); render(); toast("割り振りを反映しました"); };
  const cancel = document.getElementById("fit-cancel");
  if (cancel) cancel.onclick = () => { S.fit = null; render(); };
  const reset = document.getElementById("fit-reset");
  if (reset) reset.onclick = () => { S.w = null; S.base = BASE; S.inc = Object.fromEntries(TIERS.map((t) => [t.id, t.inc])); S.fit = null; persistInc(); render(); toast("最初の割り振りに戻しました"); };
}

function fitBlock() {
  const n = judgedRows().length, f = S.fit, w = weights();
  const skip = models.filter((m) => used(m.id) && !hasRated(m.id) && S.ratings[m.id] && JUDGE_F[S.ratings[m.id].judge]).length;
  let out = `<div class="panel">
    <h3>値段の判断から割り振りを作る<span>判断 ${n}件</span></h3>
    ${skip ? `<p class="note" style="margin:0">未採点で判断だけある ${skip}機種は計算から外しています。</p>` : ""}
    <p class="note" style="margin:0">機種ごとに付けた「この実売は安い／妥当／高い」に一番合うように、項目ごとの金額を逆算します。3件から計算でき、10件を超えると安定します。判断が少ないうちは、今の割り振りから大きくは動きません。</p>
    <div class="tools"><button type="button" class="key" id="fit-calc" ${n < 3 ? "disabled" : ""}>割り振りを計算</button>${S.w ? `<button type="button" class="key" id="fit-reset">最初の割り振りに戻す</button>` : ""}</div>`;
  if (f) {
    const keys = Object.keys(ITEMS);
    out += `<p class="note" style="margin:0">判断とのずれ：平均 <span class="num">${Math.round(f.before * 100)}%</span> → <span class="num">${Math.round(f.after * 100)}%</span></p>
      <table class="fit"><thead><tr><th>項目</th><th>今</th><th>計算結果</th></tr></thead><tbody>
      <tr><td>基準額</td><td class="num">¥${yen(S.base)}</td><td class="num">¥${yen(f.base)}</td></tr>
      ${keys.map((k) => { const d = f.w[k] - Math.round(w[k] || 0);
        return `<tr><td>${ITEMS[k].label}</td><td class="num">¥${yen(w[k] || 0)}</td><td class="num ${d > 0 ? "up" : d < 0 ? "down" : ""}">¥${yen(f.w[k])}</td></tr>`; }).join("")}
      </tbody></table>
      <details class="box" style="margin-top:0"><summary>判断した機種ごとの合い具合</summary><ul>${f.rows.map((r) =>
        `<li>${esc(byId[r.id].name)}：判断から読んだ妥当額 ¥${yen(r.target)} ／ 今 ¥${yen(r.before)} → 計算後 ¥${yen(r.after)}</li>`).join("")}</ul></details>
      <div class="tools"><button type="button" class="key go" id="fit-apply">この割り振りにする</button><button type="button" class="key" id="fit-cancel">やめる</button></div>`;
  }
  return out + `</div>`;
}

function renderTabs() {
  const v = S.view;
  if (v.name === "detail") {
    $bar.classList.add("detail");
    const ids = orderedIds(), i = ids.indexOf(v.id);
    $tabs.innerHTML = `<button type="button" class="key" id="prev" ${i <= 0 ? "disabled" : ""}>← 前の機種</button>
      <button type="button" class="key" id="list">一覧</button>
      <button type="button" class="key" id="next" ${i < 0 || i >= ids.length - 1 ? "disabled" : ""}>次の機種 →</button>`;
    document.getElementById("prev").onclick = () => i > 0 && go({ name: "detail", id: ids[i - 1] });
    document.getElementById("next").onclick = () => i >= 0 && i < ids.length - 1 && go({ name: "detail", id: ids[i + 1] });
    document.getElementById("list").onclick = () => go({ name: "list" });
    return;
  }
  $bar.classList.remove("detail");
  $tabs.innerHTML = [["list", "機種"], ["rank", "ランキング"], ["ruler", "物差し"]].map(([k, w]) =>
    `<button type="button" class="key" data-tab="${k}" ${v.name === k ? 'aria-current="page"' : ""}><span class="led"></span>${w}</button>`).join("");
  $tabs.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => go({ name: b.dataset.tab }));
}

let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000);
}

if (PUBLIC) {
  document.body.classList.add("ro");
  document.getElementById("sync-t").textContent = "採点 " + SNAPSHOT.at + " 時点";
}
render();

// 中身が同じか（キーの順番は問わない）
function same(a, b) {
  const norm = (x) => x && typeof x === "object"
    ? (Array.isArray(x) ? x.map(norm) : Object.fromEntries(Object.keys(x).sort().map((k) => [k, norm(x[k])])))
    : x;
  return JSON.stringify(norm(a)) === JSON.stringify(norm(b));
}

// ===== 保存先：db が使えれば、端末をまたいで残る =====
(async () => {
  if (PUBLIC || !window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db) return;
  S.db = db;
  if (user) {
    const w = await user.can("data.write");
    if (w === false) S.canWrite = false;
  }
  const sync = document.getElementById("sync");
  document.getElementById("sync-t").textContent = S.canWrite ? "クラウドに保存" : "閲覧のみ";
  sync.classList.add("on");
  let first = true;
  db.collection("ratings").onSnapshot((snap) => {
    const remote = {};
    let changed = false;
    snap.docs.forEach((d) => { if (d.exists) remote[d.id] = d.data(); });
    // 初回：db が空でこの端末に採点があれば、それを db へ上げる
    if (first && snap.empty && S.canWrite) {
      Object.keys(S.ratings).forEach((id) => persist(id));
    } else {
      Object.entries(remote).forEach(([id, body]) => {
        const mine = S.ratings[id];
        if ((!mine || !mine.at || (body.at && body.at >= mine.at)) && !same(mine, body)) {
          S.ratings[id] = JSON.parse(JSON.stringify(body));
          changed = true;
        }
      });
    }
    first = false;
    saveLocal();
    // 入力中の欄を壊さないよう、詳細では入力欄にフォーカスがなければ描き直す
    if (changed && !(document.activeElement && document.activeElement.tagName === "INPUT")) render();
  }, () => {});
  db.doc("settings/ruler").onSnapshot((d) => {
    if (d.exists && d.data()) {
      const b = d.data(), before = { inc: S.inc, w: S.w, base: S.base };
      S.inc = { ...S.inc, ...b.inc };
      S.w = b.w || null;
      if (b.base != null) S.base = b.base;
      if (S.view.name !== "ruler" && !same(before, { inc: S.inc, w: S.w, base: S.base })) render();
    }
  }, () => {});
})();
